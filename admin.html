<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="js/theme-init.js?v=20260911-silver"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<title>END OF EDEN — Upload</title>
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0a0a;color:#f2f2f2;font-family:'Pretendard',sans-serif;padding:32px 18px}.wrap{width:min(720px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head h1{font-size:18px;font-weight:600;margin:0}.head a{font-size:11px;color:#737373;text-decoration:none}.panel{background:#0f0f0f;border:.5px solid rgba(255,255,255,.12);border-radius:12px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.35)}.auth{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:.5px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 14px;background:transparent;color:#8b8b8b;cursor:pointer}.tab.active{background:rgba(223,223,223,.12);color:#dfdfdf;border-color:rgba(223,223,223,.3)}form{display:none}form.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}label{display:block;color:#8b8b8b;font-size:11px;margin-bottom:6px}input,textarea{width:100%;border:.5px solid rgba(255,255,255,.14);border-radius:8px;background:#0a0a0a;color:#f2f2f2;padding:10px 12px;font:inherit;font-size:13px;outline:none}input:focus,textarea:focus{border-color:rgba(223,223,223,.45)}textarea{min-height:220px;resize:vertical}.hint{font-size:10px;color:#737373;margin-top:5px}.submit{width:100%;border:0;border-radius:8px;background:#dfdfdf;color:#131313;font-weight:700;padding:11px;cursor:pointer}.submit:disabled{opacity:.45;cursor:wait}.status{min-height:18px;margin-top:12px;font-size:12px;color:#b4b4b4}.status.ok{color:#cccccc}.status.error{color:#b7b7b7}@media(max-width:600px){.auth,.grid{grid-template-columns:1fr}.panel{padding:18px}}
</style>
<script src="js/theme.js?v=20260911-silver"></script><script src="js/content-api.js?v=20260911-silver"></script>
<link rel="stylesheet" href="css/glass-preview.css?v=20260911-silver"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap"></head>
<body><div class="wrap"><div class="head"><h1>Content Upload</h1><a href="main.html">← SITE</a></div><div class="panel">
<div class="auth"><div><label for="api-url">API 주소</label><input id="api-url" type="url"></div><div><label for="token">업로드 토큰</label><input id="token" type="password" autocomplete="current-password"></div></div>
<div class="tabs"><button class="tab active" data-target="log-form">LOG</button><button class="tab" data-target="gallery-form">GALLERY</button></div>
<form id="log-form" class="active"><div class="grid"><div class="field"><label>제목</label><input name="title" required maxlength="120"></div><div class="field"><label>날짜</label><input name="date" type="date" required></div><div class="field full"><label>목록 미리보기</label><textarea name="preview" required maxlength="600" style="min-height:90px"></textarea></div><div class="field full"><label>짧은 인용문 (선택)</label><input name="quote" maxlength="240"></div><div class="field full"><label>대표 이미지</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><div class="hint">JPG, PNG, WEBP, GIF · 최대 15MB</div></div><div class="field full"><label>본문</label><textarea name="body" required></textarea><div class="hint">줄바꿈은 그대로 보존돼.</div></div></div><button class="submit">로그 업로드</button><div class="status"></div></form>
<form id="gallery-form"><div class="grid"><div class="field full"><label>이미지</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><div class="hint">JPG, PNG, WEBP, GIF · 최대 15MB</div></div><div class="field full"><label>제목 / 곡명</label><input name="title" required maxlength="120"></div><div class="field full"><label>캡션 / 가사 (선택)</label><textarea name="lyrics" maxlength="500" style="min-height:110px"></textarea></div></div><button class="submit">갤러리 업로드</button><div class="status"></div></form>
</div></div>
<script>
var apiInput=document.getElementById('api-url'),tokenInput=document.getElementById('token');apiInput.value=localStorage.getItem('eden-content-api')||window.EDEN_CONTENT_API;tokenInput.value=sessionStorage.getItem('eden-upload-token')||'';
document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab,form').forEach(function(el){el.classList.remove('active')});tab.classList.add('active');document.getElementById(tab.dataset.target).classList.add('active')})});
document.querySelectorAll('form').forEach(function(form){form.addEventListener('submit',async function(event){event.preventDefault();var status=form.querySelector('.status'),button=form.querySelector('.submit'),api=apiInput.value.replace(/\/$/,'');status.className='status';status.textContent='업로드 중…';button.disabled=true;localStorage.setItem('eden-content-api',api);sessionStorage.setItem('eden-upload-token',tokenInput.value);try{var endpoint=form.id==='log-form'?'/api/admin/logs':'/api/admin/gallery';var response=await fetch(api+endpoint,{method:'POST',headers:{Authorization:'Bearer '+tokenInput.value},body:new FormData(form)});var result=await response.json().catch(function(){return{}});if(!response.ok)throw new Error(result.error||'업로드 실패');status.className='status ok';status.textContent='업로드 완료. 사이트에 바로 반영됐어.';form.reset()}catch(error){status.className='status error';status.textContent=error.message}finally{button.disabled=false}})});
</script></body></html>
