<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENTS — END OF EDEN</title>
<script src="js/theme-init.js?v=20260911-clear-background"></script>
<script src="js/archive-content.js?v=20260911-clear-background"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Pretendard,Arial,sans-serif;color:#595959}
.entry{height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 25% 35%,#e7e7e74d,transparent 65%),radial-gradient(ellipse at 75% 65%,#dbdbdb4d,transparent 65%)}
.art{position:relative;top:10%;width:min(100%,calc(100dvh * 2400 / 1642));aspect-ratio:2400/1642;transition:transform .48s ease,opacity .48s ease}
.entry-names{position:absolute;inset:0;pointer-events:none;font-size:clamp(40px,11.5vw,173px);font-weight:800;letter-spacing:-.07em;line-height:1;color:rgba(104,104,104,.14)}
.entry-names span{position:absolute}
.entry-names span:first-child{left:7%;top:24%}
.entry-names span:last-child{right:9%;top:1%}
.art img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;transform-origin:50% 20%;transition:transform .5s ease,filter .5s ease,opacity .25s ease}
.character{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.character:focus-visible{outline:2px solid #8d8d8d;outline-offset:-5px}
.eden{right:47%}
.lilith{left:53%}
.character span{position:absolute;top:74%;padding:9px 20px;border:1px solid #ffffffba;border-radius:30px;background:#ffffff99;backdrop-filter:blur(10px);letter-spacing:.16em;font-size:13px;transition:background .2s,box-shadow .2s}
.eden span{left:41%}.lilith span{left:30%}
.character:hover span,.character:focus-visible span{background:#ffffff;box-shadow:0 0 25px #ffffff;outline:2px solid #9f9f9f}
.hint{position:absolute;bottom:12px;margin:0;font-size:11px;letter-spacing:.08em;pointer-events:none;background:#ffffffcc;padding:6px 12px;border-radius:20px}
.entry.leaving .art{pointer-events:none}
.entry.leaving .entry-names{opacity:0;transition:opacity .3s}
.entry.leaving .art img{transition:transform .3s ease-in,opacity .3s ease-in}
.entry.leaving .art .portrait-layer{opacity:0}
.entry.leaving .art[data-active="eden"] .portrait-eden{transform:translateX(-90px) scale(1.08)}
.entry.leaving .art[data-active="lilith"] .portrait-lilith{transform:translateX(90px) scale(1.08)}.entry.leaving .hint{opacity:0}
/* Hover changes transform and filter, never portrait opacity. */
.art .portrait-layer{opacity:1;filter:brightness(1) blur(0px);will-change:transform,filter}
.art .portrait-eden{transform-origin:35% 25%}
.art .portrait-lilith{transform-origin:72% 25%}
.art[data-active] .portrait-layer{opacity:1;filter:brightness(.82) blur(3px)}
.art[data-active="eden"] .portrait-eden,
.art[data-active="lilith"] .portrait-lilith{filter:none;transform:scale(1.08);z-index:2}
.character{z-index:3}
@media(prefers-reduced-motion:reduce){.art,.art img{transition:none}.entry .art img{transform:none!important}}

.mobile-agents{display:none}
@media(max-width:820px){
.entry{display:block;height:100%}.entry>.art{display:none}
.mobile-agents{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.mobile-agent{position:relative;flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;overflow:hidden}
.mobile-agent-art{display:block;color:inherit;position:relative;flex:1;min-height:180px;overflow:hidden}
.mobile-agent-art img{position:absolute;height:100%;width:auto;max-width:none;left:50%;transform:translateX(-35%)}
.mobile-agent[data-agent="lilith"] img{transform:translateX(-72%)}
.mobile-agent-footer{flex-shrink:0;padding:14px 20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#49404f}
html[data-theme="dark"] .mobile-agent-footer{color:#eee7f5}
.mobile-agent-footer h2{margin:0;font:600 26px Pretendard,sans-serif}
.mobile-agent-footer a{display:inline-block;color:inherit;padding:10px 18px;text-underline-offset:5px;font:14px Pretendard,sans-serif}
.mobile-agent-footer button{border:0;background:transparent;color:inherit;padding:10px;font:12px Pretendard,sans-serif}
}
</style>
<link rel="stylesheet" href="css/zamza-dark.css?v=20260914-agent-names">
</head>
<body>
<main class="entry" aria-label="캐릭터 선택"><div class="mobile-agents" aria-label="좌우로 넘겨 캐릭터 선택"><section class="mobile-agent" data-agent="eden" aria-label="에덴"><a class="mobile-agent-art" href="wiki.html?char=eden&entrance=left" aria-label="에덴 프로필 열기"><img src="https://content.assured.love/media/gallery/images/agents-eden-20260910.webp" alt="에덴" draggable="false"></a><div class="mobile-agent-footer"><h2>EDEN</h2><button type="button" data-slide="1">릴리스 ›</button></div></section><section class="mobile-agent" data-agent="lilith" aria-label="릴리스"><a class="mobile-agent-art" href="wiki.html?char=lilith&entrance=left" aria-label="릴리스 프로필 열기"><img src="https://content.assured.love/media/gallery/images/agents-lilith-20260910.webp" alt="릴리스" draggable="false"></a><div class="mobile-agent-footer"><h2>LILITH</h2><button type="button" data-slide="0">‹ 에덴</button></div></section></div>
 <div class="art">
  <div class="entry-names" aria-hidden="true"><span>EDEN</span><span>LILITH</span></div>
  <img class="portrait-layer portrait-eden" src="https://content.assured.love/media/gallery/images/agents-eden-20260910.webp" width="2400" height="1642" alt="" aria-hidden="true">
  <img class="portrait-layer portrait-lilith" src="https://content.assured.love/media/gallery/images/agents-lilith-20260910.webp" width="2400" height="1642" alt="" aria-hidden="true">
  <button class="character eden" aria-label="에덴 프로필 열기" data-character="eden"></button>
  <button class="character lilith" aria-label="릴리스 프로필 열기" data-character="lilith"></button>
 </div>

</main>
<script>
document.querySelectorAll('[data-slide]').forEach(function(b){b.addEventListener('click',function(){var rail=document.querySelector('.mobile-agents');rail.scrollTo({left:rail.clientWidth*Number(b.dataset.slide),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})})});
var art=document.querySelector('.art');
if(new URLSearchParams(location.search).has('return')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
 art.animate([{opacity:0},{opacity:1}],{duration:650,easing:'ease-out'});
}
document.querySelectorAll('[data-character]').forEach(function(button){
 button.addEventListener('pointerenter',function(event){if(event.pointerType!=='touch')art.dataset.active=button.dataset.character});
 button.addEventListener('pointerleave',function(){if(!document.querySelector('.entry').classList.contains('leaving'))delete art.dataset.active});
 button.addEventListener('focus',function(){art.dataset.active=button.dataset.character});
 button.addEventListener('blur',function(){if(!document.querySelector('.entry').classList.contains('leaving'))delete art.dataset.active});
 button.addEventListener('click',function(){
  var entry=document.querySelector('.entry');
  if(entry.classList.contains('leaving'))return;
  art.dataset.active=button.dataset.character;
  entry.classList.add('leaving');
  var url='wiki.html?char='+button.dataset.character+'&entrance=left';
  setTimeout(function(){
   if(window.parent!==window && window.parent.navigateArchive)window.parent.navigateArchive(url);
   else location.href=url;
  },matchMedia('(prefers-reduced-motion: reduce)').matches?0:350);
 });
});
</script>
</body>
</html>
