<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENTS — END OF EDEN</title>
<script src="js/theme-init.js"></script>
<script src="js/archive-content.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Pretendard,Arial,sans-serif;color:#655563}
.entry{height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 25% 35%,#dceaf04d,transparent 65%),radial-gradient(ellipse at 75% 65%,#f2d3e24d,transparent 65%)}
.art{position:relative;width:min(100%,calc(100dvh * 2432 / 1664));aspect-ratio:2432/1664;transition:transform .48s ease,opacity .48s ease}
.art img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
.character{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.character:focus-visible{outline:2px solid #ad829a;outline-offset:-5px}
.eden{right:54%}
.lilith{left:46%}
.character span{position:absolute;top:74%;padding:9px 20px;border:1px solid #ffffffba;border-radius:30px;background:#fff9;backdrop-filter:blur(10px);letter-spacing:.16em;font-size:13px;transition:background .2s,box-shadow .2s}
.eden span{left:41%}.lilith span{left:30%}
.character:hover span,.character:focus-visible span{background:#fff;box-shadow:0 0 25px #fff;outline:2px solid #b797ad}
.hint{position:absolute;bottom:12px;margin:0;font-size:11px;letter-spacing:.08em;pointer-events:none;background:#fffc;padding:6px 12px;border-radius:20px}
.entry.leaving .art{transform:scale(1.06);opacity:0;pointer-events:none}.entry.leaving .hint{opacity:0}
@media(prefers-reduced-motion:reduce){.art,.character span{transition:none}}
</style>
</head>
<body>
<main class="entry" aria-label="캐릭터 선택">
 <div class="art">
  <img src="https://content.assured.love/media/gallery/images/agents-entry-20260909.webp" width="2432" height="1664" alt="왼쪽의 에덴과 오른쪽의 릴리스">
  <button class="character eden" aria-label="에덴 프로필 열기" data-character="eden"></button>
  <button class="character lilith" aria-label="릴리스 프로필 열기" data-character="lilith"></button>
 </div>

</main>
<script>
document.querySelectorAll('[data-character]').forEach(function(button){
 button.addEventListener('click',function(){
  var entry=document.querySelector('.entry');
  if(entry.classList.contains('leaving'))return;
  entry.classList.add('leaving');
  var url='wiki.html?char='+button.dataset.character+'&entrance=left';
  setTimeout(function(){
   if(window.parent!==window && window.parent.navigateArchive)window.parent.navigateArchive(url);
   else location.href=url;
  },matchMedia('(prefers-reduced-motion: reduce)').matches?0:320);
 });
});
</script>
</body>
</html>
