<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f0f;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-text-primary: #f2f2f2;
  --color-text-secondary: #b4b4b4;
  --color-text-tertiary: #737373;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.log-wrap {
  width: 100%;
  max-width: 960px;
  height: 580px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
}

.log-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2.5rem 4rem;
}
.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.log-item {
  color:inherit;
  text-decoration:none;
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  padding: 1.75rem 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  cursor: pointer;
  transition: opacity 0.15s;
}
.log-item:first-child { padding-top: 0; }
.log-item:last-child { border-bottom: none; }
.log-item:hover { opacity: 0.75; }
.log-item:focus-visible { outline:2px solid currentColor; outline-offset:2px; }

.log-item-text { flex: 1; min-width: 0; }
.log-item-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.log-item-date {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
}
.log-item-preview {
  font-size: 13px;
  line-height: 1.7;
  color: var(--color-text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.log-item-thumb {
  width: 150px;
  height: 150px;
  border-radius: var(--border-radius-md);
  object-fit: cover;
  flex-shrink: 0;
  border: 0.5px solid var(--color-border-tertiary);
}
.log-wrap { width:100%; max-width:none; height:100%; border:0; border-radius:0; box-shadow:none; background:#ffffff; }
.log-scroll { padding:26px 42px; }
.log-scroll::-webkit-scrollbar { width:12px; }.log-scroll::-webkit-scrollbar-track{background:#ececec}.log-scroll::-webkit-scrollbar-thumb{border:2px solid #ececec;border-radius:0;background:#b7b7b7}
.log-item { padding:20px 0; border-bottom:1px solid #d1d1d1; }
.log-item-title { color:#2f2f2f; font-size:16px; font-weight:700; }
.log-item-title::before { content:'▸ '; color:#7c7c7c; }
.log-item-date { color:#7e7e7e; font:400 9px/1.5 "Galmuri11","Pretendard",sans-serif; }
.log-item-preview { color:#565656; }
.log-item-thumb { border:1px solid #c0c0c0; border-radius:0; }
.log-item:hover { opacity:1; background:#f7f7f7; }

@media (max-width: 640px) {
  .log-scroll { padding: 2rem 1.25rem; }
  .log-item { gap: 1rem; align-items: center; }
  .log-item-thumb { width: 112px; height: 112px; }
  .log-item-title { font-size: 14px; line-height: 1.45; word-break: keep-all; }
  .log-item-preview { font-size: 12px; line-height: 1.6; -webkit-line-clamp: 3; word-break: keep-all; }
}
</style>
