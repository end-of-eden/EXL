<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩵</text></svg>">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>END OF EDEN — Log</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f14;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-text-primary: #f2f2f5;
  --color-text-secondary: #b0b4bd;
  --color-text-tertiary: #6f7380;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.log-wrap {
  width: 100%;
  max-width: 960px;
  height: 580px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
}

.log-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2.5rem 4rem;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.log-scroll.dragging { cursor: grabbing; }
.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.log-item {
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  padding: 1.75rem 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  cursor: pointer;
  transition: opacity 0.15s;
}
.log-item:first-child { padding-top: 0; }
.log-item:last-child { border-bottom: none; }
.log-item:hover { opacity: 0.75; }

.log-item-text { flex: 1; min-width: 0; }
.log-item-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.log-item-date {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
}
.log-item-preview {
  font-size: 13px;
  line-height: 1.7;
  color: var(--color-text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.log-item-thumb {
  width: 150px;
  height: 150px;
  border-radius: var(--border-radius-md);
  object-fit: cover;
  flex-shrink: 0;
  border: 0.5px solid var(--color-border-tertiary);
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-music">
    <button class="music-btn" id="music-btn" onclick="toggleMusic()" aria-label="재생">
      <i class="ti ti-player-play" id="music-icon"></i>
    </button>
    <span class="music-title">Avicii — SOS ft. Aloe Blacc</span>
    <audio id="bgm" src="Avicii - SOS (Fan Memories Video) ft. Aloe Blacc.mp3" loop></audio>
  </div>
  <div class="topnav-links">
    <a href="wiki.html">Wiki</a>
    <div class="topnav-divider"></div>
    <a href="gallery.html">Gallery</a>
    <div class="topnav-divider"></div>
    <a href="log.html" class="active">Log</a>
  </div>
</nav>

<div class="log-wrap">
  <div class="log-scroll" id="log-scroll">
    <div id="log-list"></div>
  </div>
</div>

<script>
// ✏️ 로그 추가할 때 여기에 한 줄씩 추가
var logs = [
  { id: '001', title: '유튜브 시청 기록', date: '2026.06.26', preview: '최근 차시아가 자신의 튼 입술에 립밤을 발라주었던 사건 이후, 에덴은 난생처음으로 \'립밤\'이라는 물건에 대해 진지하게 고찰하기 시작했다. 그녀의 입술 역시 건조한 아크의 공기 속에서 상하지는 않을까...', thumb: 'img/log/001.jpg' },
];

var base = 'https://raw.githubusercontent.com/end-of-eden/EXL/main/';

function render() {
  var list = document.getElementById('log-list');
  list.innerHTML = logs.map(function(log) {
    return '<div class="log-item" onclick="location.href=\'Log/' + log.id + '.html\'">' +
      '<div class="log-item-text">' +
      '<div class="log-item-title">' + log.title + '</div>' +
      '<div class="log-item-date">' + log.date + '</div>' +
      '<div class="log-item-preview">' + log.preview + '</div>' +
      '</div>' +
      '<img class="log-item-thumb" src="' + base + log.thumb + '" alt="' + log.title + '" loading="lazy">' +
      '</div>';
  }).join('');
}

render();

function toggleMusic() {
  var audio = document.getElementById("bgm");
  audio.volume = 0.3;
  var icon = document.getElementById('music-icon');
  if (audio.paused) {
    audio.play();
    icon.className = 'ti ti-player-pause';
    localStorage.setItem('bgm-playing', '1');
  } else {
    audio.pause();
    icon.className = 'ti ti-player-play';
    localStorage.setItem('bgm-playing', '0');
  }
}

(function initBgm() {
  var audio = document.getElementById('bgm');
  var icon = document.getElementById('music-icon');
  if (!audio) return;
  audio.volume = 0.3;
  var savedTime = parseFloat(localStorage.getItem('bgm-time') || '0');
  var wasPlaying = localStorage.getItem('bgm-playing') === '1';
  audio.addEventListener('loadedmetadata', function() {
    if (savedTime && savedTime < audio.duration) audio.currentTime = savedTime;
  });
  if (wasPlaying) {
    audio.play().then(function() {
      icon.className = 'ti ti-player-pause';
    }).catch(function() {
      icon.className = 'ti ti-player-play';
      localStorage.setItem('bgm-playing', '0');
    });
  }
  audio.addEventListener('timeupdate', function() {
    localStorage.setItem('bgm-time', audio.currentTime);
  });
  window.addEventListener('beforeunload', function() {
    localStorage.setItem('bgm-time', audio.currentTime);
  });
})();

var scrollEl = document.getElementById('log-scroll');
var isDown = false, startY = 0, scrollTop = 0;
scrollEl.addEventListener('mousedown', function(e) {
  isDown = true; startY = e.pageY - scrollEl.offsetTop; scrollTop = scrollEl.scrollTop;
  scrollEl.classList.add('dragging');
});
document.addEventListener('mouseup', function() { isDown = false; scrollEl.classList.remove('dragging'); });
scrollEl.addEventListener('mousemove', function(e) {
  if (!isDown) return;
  e.preventDefault();
  scrollEl.scrollTop = scrollTop - (e.pageY - scrollEl.offsetTop - startY);
});
</script>

<script src="sparkle.js"></script>
</body>
</html>
