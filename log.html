<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f14;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-text-primary: #f2f2f5;
  --color-text-secondary: #b0b4bd;
  --color-text-tertiary: #6f7380;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.log-wrap {
  width: 100%;
  max-width: 960px;
  height: 580px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
}

.log-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2.5rem 4rem;
}
.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.log-item {
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  padding: 1.75rem 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  cursor: pointer;
  transition: opacity 0.15s;
}
.log-item:first-child { padding-top: 0; }
.log-item:last-child { border-bottom: none; }
.log-item:hover { opacity: 0.75; }

.log-item-text { flex: 1; min-width: 0; }
.log-item-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.log-item-date {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
}
.log-item-preview {
  font-size: 13px;
  line-height: 1.7;
  color: var(--color-text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.log-item-thumb {
  width: 150px;
  height: 150px;
  border-radius: var(--border-radius-md);
  object-fit: cover;
  flex-shrink: 0;
  border: 0.5px solid var(--color-border-tertiary);
}
.log-wrap { width:100%; max-width:none; height:100%; border:0; border-radius:0; box-shadow:none; background:#fff; }
.log-scroll { padding:26px 42px; }
.log-scroll::-webkit-scrollbar { width:12px; }.log-scroll::-webkit-scrollbar-track{background:#ececef}.log-scroll::-webkit-scrollbar-thumb{border:2px solid #ececef;border-radius:0;background:#b6b7bc}
.log-item { padding:20px 0; border-bottom:1px solid #d0d1d4; }
.log-item-title { color:#2e2f35; font-size:16px; font-weight:700; }
.log-item-title::before { content:'▸ '; color:#b36a86; }
.log-item-date { color:#8a7a81; font:400 9px/1.5 "Galmuri11","Pretendard",sans-serif; }
.log-item-preview { color:#55565d; }
.log-item-thumb { border:1px solid #bfc0c4; border-radius:0; }
.log-item:hover { opacity:1; background:#faf6f8; }

@media (max-width: 640px) {
  .log-scroll { padding: 2rem 1.25rem; }
  .log-item { gap: 1rem; align-items: center; }
  .log-item-thumb { width: 112px; height: 112px; }
  .log-item-title { font-size: 14px; line-height: 1.45; word-break: keep-all; }
  .log-item-preview { font-size: 12px; line-height: 1.6; -webkit-line-clamp: 3; word-break: keep-all; }
}

<script>
// ✏️ 로그 추가할 때 여기에 한 줄씩 추가
var logs = [
  { id: '001', title: '유튜브 시청 기록', date: '2026.06.26', preview: '에덴의 유튜브 알고리즘에 낱낱이 드러난 그의 진심. 립밤 ASMR부터 고양이 영상, 죽어가던 검은 장미를 살리는 가드닝 브이로그, 그리고 차마 검색했다는 걸 들키고 싶지 않은 프로포즈 영상까지 — 겉으로는 시큰둥한 척해도, 알고리즘은 릴리스를 향한 그의 마음을 숨기지 못한다.', thumb: 'img/log/001.jpg' },
  { id: '002', title: '서로가 생각하는 서로를 닮은 카오모지', date: '2026.06.27', preview: '에덴이 생각하는 릴리스를 닮은 카오모지, 그리고 릴리스가 생각하는 에덴을 닮은 카오모지. 잔뜩 시무룩해진 얼굴부터, 무심한 척 던지는 애정까지 — 서로가 서로를 어떻게 바라보고 있는지 훔쳐볼 수 있는 기록.', thumb: 'img/log/002.jpg' },
  { id: '003', title: '최고의 남자친구', date: '2026.06.28', preview: '휴게실에서 흘러나온 동료들의 뒷담화가 하필 에덴의 프로필을 그대로 저격하던 순간, 릴리스가 까치발을 들고 그의 두 귀를 꼭 틀어막았다. 세상에서 가장 진지한 표정으로 외치는 서툰 위로에, 냉혹한 R.S.T.의 해결사는 귀 끝까지 새빨개지고 만다.', thumb: 'img/log/003.jpg' },
  { id: '004', title: '뚱뚱해', date: '2026.07.02', preview: '뱅가드 2팀 회식에서 릴리스가 따라준 술에 잔뜩 취해 뻗었다가 아침에 눈을 뜬 에덴은 그녀에게 애정 표현을 시도하지만 그가 치는 모든 달콤한 말은 예외 없이 \'뚱뚱해\'로 바뀌어 전송된다. 범인은 뻔했다 — 복도 건너에서 잠든 척하고 있을 그녀.', thumb: 'img/log/004.jpg' },
];

var base = '';

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function render() {
  var list = document.getElementById('log-list');
  list.innerHTML = logs.map(function(log) {
    var href = log.remote
      ? 'Log/view.html?id=' + encodeURIComponent(log.id) + '&v=20260907-log-detail-frame'
      : 'Log/' + encodeURIComponent(log.id) + '.html?v=20260907-log-detail-frame';
    return '<div class="log-item" data-href="' + escapeHtml(href) + '">' +
      '<div class="log-item-text">' +
      '<div class="log-item-title">' + escapeHtml(log.title) + '</div>' +
      '<div class="log-item-date">' + escapeHtml(log.date) + '</div>' +
      '<div class="log-item-preview">' + escapeHtml(log.preview) + '</div>' +
      '</div>' +
      '<img class="log-item-thumb" src="' + escapeHtml(log.thumbUrl || (base + log.thumb)) + '" alt="' + escapeHtml(log.title) + '" loading="lazy">' +
      '</div>';
  }).join('');

  Array.prototype.forEach.call(list.querySelectorAll('.log-item'), function(item) {
    item.addEventListener('click', function() { location.href = item.dataset.href; });
  });
}

render();

fetch(window.EDEN_CONTENT_API + '/api/logs')
  .then(function(response) { if (!response.ok) throw new Error('load failed'); return response.json(); })
  .then(function(remoteLogs) {
    logs = remoteLogs.map(function(log) {
      log.remote = true;
      log.thumbUrl = window.EDEN_CONTENT_API + log.imagePath;
      return log;
    }).concat(logs);
    render();
  })
  .catch(function() { /* R2가 준비되지 않아도 기존 로그는 그대로 표시 */ });


</script>
