.mini-home { min-height: 0; padding: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 0; border: 2px solid; border-color: #262831 #777983 #777983 #262831; background: #171920; }

.sidebar-stack { min-height: 0; display: block; background: #24272f; border-right: 1px solid #50535c; }

.side-card { padding: 18px 16px; }
.category-card { height: 100%; padding: 22px 18px; border: 0; background: transparent; }
.home-content { border: 0; }

html[data-theme="light"] .category-card { border: 0; background: transparent; }
html[data-theme="light"] .home-content { border: 0; }
html[data-theme="light"] .explorer-label { color: #aaa5aa; }

html[data-theme="light"] .explorer-root i, html[data-theme="light"] .explorer-branch-title { color: #908b91; }
.sidebar-messenger { height: 94px; min-height: 0; align-self: start; overflow: hidden; padding: 0; }
.sidebar-messenger.expanded { height: auto; align-self: stretch; }
.profile-photo { width: 100%; aspect-ratio: 1 / 1; margin-bottom: 12px; overflow: hidden; border: 0.5px solid var(--border); border-radius: 7px; background: var(--surface-2); }
.profile-photo img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
.profile-strip-section { margin: 0; padding: 0; }
.profile-strip { position: relative; width: 100%; height: 108px; margin-top: 10px; overflow: hidden; border: 2px solid; border-color: #252730 #6f727b #6f727b #252730; border-radius: 0; background: var(--surface-2); }

.profile-strip:hover img { transform: scale(1.045); filter: brightness(.84); }
.profile-strip-copy { position: absolute; inset: 0; padding: 10px; display: flex; align-items: flex-end; justify-content: space-between; color: #fff; font-size: 10px; font-weight: 650; letter-spacing: .08em; text-shadow: 0 1px 5px rgba(0,0,0,.8); }

.sidebar-banner { padding: 0; overflow: hidden; }
.sidebar-banner summary { min-height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; }
.sidebar-banner summary::-webkit-details-marker { display: none; }
.sidebar-banner summary::after { content: '+'; color: var(--text-3); font-size: 16px; font-weight: 300; transition: transform .2s ease; }
.sidebar-banner[open] summary::after { transform: rotate(45deg); }
.sidebar-banner-content { padding: 0 16px 16px; border-top: 0.5px solid var(--border); }
.recent-log { margin-top: 15px; padding-top: 13px; border-top: 0.5px dashed var(--border); }
.recent-log-card { margin-top: 9px; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
.recent-log-title { color: var(--text); font-size: 13px; font-weight: 650; }

.room-seek { appearance: none; -webkit-appearance: none; width: 100%; height: 3px; border: 0; border-radius: 99px; outline: none; background: linear-gradient(to right, var(--pink) 0 var(--seek-level, 0%), rgba(255,255,255,.28) var(--seek-level, 0%) 100%); cursor: pointer; }

.room-seek::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--pink); }
.room-control-row { display: flex; align-items: center; gap: 11px; }
.room-control { padding: 2px; border: 0; background: transparent; color: #fff; font-size: 15px; line-height: 1; cursor: pointer; }
.room-time { color: rgba(255,255,255,.86); font-size: 10px; font-variant-numeric: tabular-nums; }
.main-wrap::-webkit-scrollbar { width: 3px; }
.main-wrap::-webkit-scrollbar-track { background: transparent; }
.main-wrap::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
.eyebrow { color: var(--blue); font-size: 10px; letter-spacing: 0.18em; }
h1 { margin-top: 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(32px, 5vw, 52px); font-weight: 700; letter-spacing: 0.04em; }
.subtitle { margin-top: 10px; color: var(--text-3); font-size: 13px; letter-spacing: 0.08em; }
.line { height: 1px; margin: 2rem 0; background: var(--border); }

.profile-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 2.5rem; }
.section-label { margin-bottom: 14px; color: var(--text-3); font-size: 10px; letter-spacing: 0.15em; }
.handle { font-size: 24px; font-weight: 700; }
.status { display: flex; align-items: center; gap: 7px; margin-top: 9px; color: var(--text-2); font-size: 11px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
.owner-note { color: var(--text-2); font-size: 14px; line-height: 1.8; }

.banner-exchange { display: grid; grid-template-columns: 1fr 1.6fr; gap: 2.5rem; }
.banner-list { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
.banner-list img { width: 200px; height: 40px; display: block; object-fit: cover; }
.my-banner-list { flex-direction: column; align-items: flex-start; }
.banner-guidance { margin-bottom: 20px; }

@media (max-width: 680px) {
  body { padding: 14px; justify-content: flex-start; }
  .site-shell { height: calc(100vh - 28px); }
  .topnav { width: 100%; }
  .topnav-links { flex-direction: column; align-items: stretch; gap: 3px; }
  .topnav-links::before { display: none; }
  .topnav-divider { display: block; width: 1px; height: 12px; background: var(--border); margin: 0 4px; }
  .topnav a { padding: 5px 7px; font-size: 10px; }
  .main-wrap { height: 100%; min-height: 0; overflow-y: auto; }
  .mini-home { grid-template-columns: 1fr; }
  .sidebar-stack { display: block; min-height: auto; }
  .profile-strip-section { display: none; }
  .sidebar-messenger, .sidebar-messenger.expanded { flex: 0 0 420px; height: 420px; }
  .profile-photo { display: none; }
  .home-content { padding: 12px; }
  .home-board { grid-template-columns: 1fr; }
  .recent-memory { flex: none; height: 150px; }
  .board-meta { display: none; }
  .profile-grid { grid-template-columns: 1fr; gap: 1.5rem; }
  .banner-exchange { grid-template-columns: 1fr; gap: 1.5rem; }
}

/* All desktop windows share the exact same outer chrome. Keep this last so
   legacy responsive rules cannot turn the main window back into a card. */
.main-wrap {
  padding: 5px !important;
  border: 2px solid !important;
  border-color: #6f7178 #262831 #262831 #6f7178 !important;
  border-radius: 0 !important;
  background: #3a3d46 !important;
  box-shadow: inset -1px -1px 0 #252730, 3px 3px 12px rgba(0,0,0,.3) !important;

<script>
(function () {
  var start = Date.UTC(2026, 0, 1);
  var now = new Date();
  var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.floor((today - start) / 86400000) + 1;
  var label = document.getElementById('hongcha-day');
  if (label) label.textContent = days >= 1 ? 'D+' + days : 'D' + days;
})();

(function () {
  var video = document.getElementById('room-video');
  var seek = document.getElementById('room-seek');
  var play = document.getElementById('room-play');
  var mute = document.getElementById('room-mute');
  var time = document.getElementById('room-time');
  var seeking = false;

  function formatTime(seconds) {
    if (!isFinite(seconds)) return '0:00';
    seconds = Math.max(0, Math.floor(seconds));
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }

  function updateTime() {
    if (!seeking) seek.value = video.duration ? (video.currentTime / video.duration) * 100 : 0;
    seek.style.setProperty('--seek-level', seek.value + '%');
    time.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
  }

  video.addEventListener('loadedmetadata', updateTime);
  video.addEventListener('timeupdate', updateTime);
  video.addEventListener('play', function () {
    play.textContent = '⏸';
    play.setAttribute('aria-label', '일시정지');
    try {
      if (window.parent !== window && window.parent.player && window.parent.player.pauseVideo) {
        window.parent.player.pauseVideo();
      }
    } catch (_) {}
  });
  video.addEventListener('pause', function () {
    play.textContent = '▶';
    play.setAttribute('aria-label', '재생');
  });

  video.volume = 0.3;
  play.addEventListener('click', function () {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  });

  mute.addEventListener('click', function () {
    video.muted = !video.muted;
    mute.textContent = video.muted ? '🔇' : '🔊';
    mute.setAttribute('aria-label', video.muted ? '음소거 해제' : '음소거');
  });

  seek.addEventListener('input', function () {
    seeking = true;
    seek.style.setProperty('--seek-level', seek.value + '%');
    time.textContent = formatTime((seek.value / 100) * video.duration) + ' / ' + formatTime(video.duration);
  });
  seek.addEventListener('change', function () {
    video.currentTime = (seek.value / 100) * video.duration;
    seeking = false;
    updateTime();
  });
})();
</script>
