<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/theme-init.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='54%25' font-size='70' text-anchor='middle' dominant-baseline='central'>💙</text></svg>"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>END OF EDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0a0f;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 1;
  transition: opacity 0.4s ease;
}

body.fade-out {
  opacity: 0;
  transition: opacity 0.4s ease;
}

.roster-wrap {
  max-width: 800px;
  width: 100%;
}

.hero-video {
  position: relative;
  border: 0.5px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: #000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
  cursor: pointer;
}

.hero-video video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.yt-overlay {
  position: absolute;
  inset: 0;
  transition: opacity 0.3s ease;
}

.yt-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.15);
}

.yt-play-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 64px; height: 44px;
  background: rgba(20,20,20,0.75);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.yt-play-btn::after {
  content: '';
  width: 0; height: 0;
  border-style: solid;
  border-width: 10px 0 10px 17px;
  border-color: transparent transparent transparent #ffffff;
  margin-left: 4px;
}

.yt-duration {
  position: absolute;
  right: 12px; bottom: 12px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.02em;
}

.yt-progress {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: rgba(255,255,255,0.3);
}
.yt-progress::after {
  content: '';
  display: block;
  height: 100%;
  width: 62%;
  background: #ff0033;
}

.hover-reveal {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,0.55);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.3s ease;
  text-align: center;
}

.hover-reveal .hover-title {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
  text-shadow: 0 2px 14px rgba(0,0,0,0.7);
}

.hover-reveal .hover-enter {
  margin-top: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.75);
}

.hero-video:hover video {
  filter: brightness(0.6) blur(1px);
}

.hero-video:hover .yt-overlay {
  opacity: 0;
}

.hero-video:hover .hover-reveal {
  opacity: 1;
}
</style>
<script src="js/theme.js"></script>
</head>
<body>
<div class="roster-wrap">
  <div class="hero-video" onclick="goToMain()">
    <video id="hero-video-el" src="img/video/main-hero.mp4" preload="auto" muted playsinline></video>
    <div class="yt-overlay">
      <div class="yt-play-btn"></div>
      <div class="yt-duration" id="yt-duration">0:00</div>
      <div class="yt-progress"></div>
    </div>
    <div class="hover-reveal">
      <div class="hover-title">相互確證破壞</div>
      <div class="hover-enter">ENTER →</div>
    </div>
  </div>
</div>

<script>
if (window.location.pathname === '/index.html') {
  window.history.replaceState(null, '', '/');
}

var heroVideo = document.getElementById('hero-video-el');
var durationLabel = document.getElementById('yt-duration');

heroVideo.addEventListener('loadedmetadata', function() {
  var total = Math.round(heroVideo.duration);
  var minutes = Math.floor(total / 60);
  var seconds = String(total % 60).padStart(2, '0');
  durationLabel.textContent = minutes + ':' + seconds;
});

function goToMain() {
  document.body.classList.add('fade-out');
  setTimeout(function() {
    location.href = 'playlist-test.html';
  }, 400);
}
window.addEventListener('pageshow', function(e) {
  document.body.classList.remove('fade-out');
});
</script>
<script src="js/sparkle.js"></script>
</body>
</html>
