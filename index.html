<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/theme-init.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='54%25' font-size='70' text-anchor='middle' dominant-baseline='central'>💙</text></svg>"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>END OF EDEN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0a0f;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 1;
  transition: opacity 0.4s ease;
}

body.fade-out {
  opacity: 0;
  transition: opacity 0.4s ease;
}

.roster-wrap {
  max-width: 800px;
  width: 100%;
}

.hero-video {
  position: relative;
  border: 0.5px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: #0f0f14;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.hero-video:hover {
  transform: translateY(-4px);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 14px 40px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.35);
}

.hero-video video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-video::before {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 35%;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
  pointer-events: none;
  z-index: 1;
}

.play-status {
  position: absolute;
  left: 18px;
  bottom: 16px;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.play-status .play-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4a9d8f;
  box-shadow: 0 0 6px #4a9d8f;
}

.play-status.is-paused .play-dot {
  background: rgba(255,255,255,0.5);
  box-shadow: none;
  animation: none;
}

.play-status:not(.is-paused) .play-dot {
  animation: pulse-dot 1.8s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

.enter-hint {
  position: absolute;
  right: 18px;
  bottom: 16px;
  z-index: 2;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0);
  transition: color 0.3s ease;
}

.hero-video:hover .enter-hint {
  color: rgba(255,255,255,0.9);
}

.mute-toggle {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(10,10,15,0.6);
  color: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.mute-toggle:hover { background: rgba(10,10,15,0.8); }
</style>
<script src="js/theme.js"></script>
</head>
<body>
<div class="roster-wrap">
  <div class="hero-video" onclick="goToMain()">
    <video id="hero-video-el" src="img/video/main-hero.mp4" autoplay loop playsinline></video>
    <div class="play-status is-paused" id="play-status">
      <span class="play-dot"></span>
      <span id="play-status-label">LOADING</span>
    </div>
    <span class="enter-hint">ENTER →</span>
    <button type="button" class="mute-toggle" id="mute-toggle" onclick="toggleMute(event)" aria-label="소리 끄기">🔊</button>
  </div>
</div>

<script>
if (window.location.pathname === '/index.html') {
  window.history.replaceState(null, '', '/');
}

var heroVideo = document.getElementById('hero-video-el');
var muteButton = document.getElementById('mute-toggle');
var playStatus = document.getElementById('play-status');
var playStatusLabel = document.getElementById('play-status-label');

heroVideo.addEventListener('playing', function() {
  playStatus.classList.remove('is-paused');
  playStatusLabel.textContent = 'PLAYING';
});
heroVideo.addEventListener('pause', function() {
  playStatus.classList.add('is-paused');
  playStatusLabel.textContent = 'PAUSED';
});

heroVideo.volume = 0.3;
heroVideo.play().catch(function() {
  heroVideo.muted = true;
  muteButton.textContent = '🔇';
  muteButton.setAttribute('aria-label', '소리 켜기');
  heroVideo.play();
});

function toggleMute(e) {
  e.stopPropagation();
  var video = document.getElementById('hero-video-el');
  var button = document.getElementById('mute-toggle');
  video.muted = !video.muted;
  button.textContent = video.muted ? '🔇' : '🔊';
  button.setAttribute('aria-label', video.muted ? '소리 켜기' : '소리 끄기');
}

function goToMain() {
  document.body.classList.add('fade-out');
  setTimeout(function() {
    location.href = 'playlist-test.html';
  }, 400);
}
window.addEventListener('pageshow', function(e) {
  document.body.classList.remove('fade-out');
});
</script>
<script src="js/sparkle.js"></script>
</body>
</html>
