<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f0f;
  --color-background-secondary: #1b1b1b;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-text-primary: #f2f2f2;
  --color-text-secondary: #b4b4b4;
  --color-text-tertiary: #737373;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.gallery-wrap {
  width: 100%;
  max-width: 960px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
  height: 580px;
}

.gallery-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1.75rem;
}
.gallery-scroll::-webkit-scrollbar { width: 3px; }
.gallery-scroll::-webkit-scrollbar-track { background: transparent; }
.gallery-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.gallery-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--border-radius-md);
  overflow: hidden;
  cursor: pointer;
  background: var(--color-background-secondary);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.gallery-item-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  transition: background 0.3s ease;
}

.gallery-item:hover .gallery-item-overlay {
  background: rgba(0,0,0,0.55);
}

.gallery-item-title {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0);
  letter-spacing: 0.03em;
  transition: color 0.3s ease;
  line-height: 1.4;
  text-align: center;
}
.gallery-item-lyrics {
  margin-top: 5px; color: rgba(255,255,255,0); font-size: 10px;
  font-weight: 300; line-height: 1.5; text-align: center; transition: color 0.3s ease;
}

.gallery-item:hover .gallery-item-title {
  color: rgba(255,255,255,0.9);
}
.gallery-item:hover .gallery-item-lyrics { color: rgba(255,255,255,0.88); }

@media (max-width: 640px) {
  .gallery-scroll { padding: 1.25rem; }
  .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}

.gallery-wrap { width:100%; max-width:none; height:100%; border:0; border-radius:0; box-shadow:none; background:#ffffff; }
.gallery-scroll { padding:22px; }
.gallery-scroll::-webkit-scrollbar { width:12px; }.gallery-scroll::-webkit-scrollbar-track{background:#ececec}.gallery-scroll::-webkit-scrollbar-thumb{border:2px solid #ececec;border-radius:0;background:#b7b7b7}
.gallery-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.gallery-item { border:1px solid #c9c9c9; border-radius:0; background:#ececec; box-shadow:2px 2px 0 rgba(0,0,0,.07); }
.gallery-item:hover { border-color:#898989; }
@media(max-width:980px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
// Gallery entries come from the upload service.
var images = [];
var galleryPage = 0;




function imageUrl(img) {
  return window.EDEN_CONTENT_API + img.imagePath;
}

function thumbnailUrl(img) {
  return window.EDEN_CONTENT_API + (img.thumbnailPath || img.imagePath);
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function render() {
  var grid = document.getElementById('gallery-grid');
  if (!images.length) { grid.innerHTML = '<p class="gallery-status" role="status">사진을 불러오는 중…</p>'; return; }
  galleryPage = Math.min(galleryPage, images.length - 1);
  var selected = images[galleryPage];
  document.getElementById('gallery-title').textContent = selected.title || '';
  document.getElementById('gallery-caption').textContent = selected.lyrics || '';
  document.getElementById('gallery-prev').disabled = galleryPage === 0;
  document.getElementById('gallery-next').disabled = galleryPage === images.length - 1;
  document.getElementById('gallery-page').textContent = (galleryPage + 1) + ' / ' + images.length;
  grid.innerHTML = '<div class="gallery-featured"><img draggable="false" src="' + escapeHtml(imageUrl(selected)) + '" alt="' + escapeHtml(selected.title) + '" decoding="async"></div>';
  document.getElementById('gallery-thumbnails').innerHTML = images.map(function(img, i) {
    return '<button type="button" class="gallery-thumbnail" aria-label="' + escapeHtml(img.title) + '" aria-pressed="' + (i === galleryPage) + '" onclick="selectGalleryImage(' + i + ')"><img src="' + escapeHtml(thumbnailUrl(img)) + '" alt="" decoding="async"></button>';
  }).join('');
}

function selectGalleryImage(index) {
  galleryPage = index;
  render();
  var selected = document.querySelector('.gallery-thumbnail[aria-pressed="true"]');
  if (selected) selected.focus({preventScroll:true});
}
function changeGalleryPage(delta) {
  var next = galleryPage + delta;
  if (next < 0 || next >= images.length) return;
  galleryPage = next;
  render();
}
document.getElementById('gallery-prev').addEventListener('click', function () { changeGalleryPage(-1); });
document.getElementById('gallery-next').addEventListener('click', function () { changeGalleryPage(1); });
var galleryGrid = document.getElementById('gallery-grid');
var drag = null;
galleryGrid.addEventListener('pointerdown', function (event) {
  if (!event.isPrimary || event.button !== 0) return;
  drag = { id:event.pointerId, x:event.clientX, y:event.clientY };
  galleryGrid.setPointerCapture(event.pointerId);
  galleryGrid.classList.add('is-dragging');
});
galleryGrid.addEventListener('pointermove', function (event) {
  if (!drag || event.pointerId !== drag.id) return;
  var photo = galleryGrid.querySelector('.gallery-featured');
  if (photo) photo.style.transform = 'translateX(' + Math.max(-120, Math.min(120, event.clientX - drag.x)) + 'px)';
});
function endDrag(event) {
  if (!drag || event.pointerId !== drag.id) return;
  var dx = event.clientX - drag.x;
  var dy = event.clientY - drag.y;
  drag = null;
  galleryGrid.classList.remove('is-dragging');
  if (galleryGrid.hasPointerCapture(event.pointerId)) galleryGrid.releasePointerCapture(event.pointerId);
  var photo = galleryGrid.querySelector('.gallery-featured');
  if (photo) photo.style.transform = '';
  if (event.type === 'pointerup' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) changeGalleryPage(dx < 0 ? 1 : -1);
}
galleryGrid.addEventListener('pointerup', endDrag);
galleryGrid.addEventListener('pointercancel', endDrag);
galleryGrid.addEventListener('lostpointercapture', endDrag);

try { var cached=JSON.parse(sessionStorage.getItem('eden-gallery-list-v2')||'null'); if(Array.isArray(cached))images=cached; } catch (_) {}
render();

fetch(window.EDEN_CONTENT_API + '/api/gallery')
  .then(function(response) { if (!response.ok) throw new Error('load failed'); return response.json(); })
  .then(function(remoteImages) {
    if (!Array.isArray(remoteImages)) throw new Error('invalid gallery');
    images = remoteImages.slice().sort(function(a, b) {
      // Keep the curated migration order; subsequent uploads follow chronologically.
      var aOrder = Number.isFinite(a.displayOrder) ? a.displayOrder : Infinity;
      var bOrder = Number.isFinite(b.displayOrder) ? b.displayOrder : Infinity;
      if (aOrder !== bOrder) return aOrder - bOrder;
      return String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a.id).localeCompare(String(b.id));
    });
    try { sessionStorage.setItem('eden-gallery-list-v2',JSON.stringify(images)); } catch (_) {}
    render();
    if (!images.length) document.getElementById('gallery-grid').innerHTML = '<p class="gallery-status" role="status">등록된 사진이 없어요.</p>';
  })
  .catch(function() { if (!images.length) document.getElementById('gallery-grid').innerHTML = '<p class="gallery-status" role="alert">사진을 불러오지 못했어요. 잠시 후 다시 열어주세요.</p>'; });


</script>
