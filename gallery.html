<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f0f;
  --color-background-secondary: #1b1b1b;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-text-primary: #f2f2f2;
  --color-text-secondary: #b4b4b4;
  --color-text-tertiary: #737373;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.gallery-wrap {
  width: 100%;
  max-width: 960px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
  height: 580px;
}

.gallery-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1.75rem;
}
.gallery-scroll::-webkit-scrollbar { width: 3px; }
.gallery-scroll::-webkit-scrollbar-track { background: transparent; }
.gallery-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.gallery-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--border-radius-md);
  overflow: hidden;
  cursor: pointer;
  background: var(--color-background-secondary);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.gallery-item-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  transition: background 0.3s ease;
}

.gallery-item:hover .gallery-item-overlay {
  background: rgba(0,0,0,0.55);
}

.gallery-item-title {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0);
  letter-spacing: 0.03em;
  transition: color 0.3s ease;
  line-height: 1.4;
  text-align: center;
}
.gallery-item-lyrics {
  margin-top: 5px; color: rgba(255,255,255,0); font-size: 10px;
  font-weight: 300; line-height: 1.5; text-align: center; transition: color 0.3s ease;
}

.gallery-item:hover .gallery-item-title {
  color: rgba(255,255,255,0.9);
}
.gallery-item:hover .gallery-item-lyrics { color: rgba(255,255,255,0.88); }

@media (max-width: 640px) {
  .gallery-scroll { padding: 1.25rem; }
  .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}

/* 팝업 */
.popup-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.popup-bg.open { display: flex; }

.popup-inner {
  position: relative;
  max-width: 800px;
  width: 90%;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}

.popup-inner img {
  width: 100%;
  display: block;
  max-height: 85vh;
  object-fit: contain;
  background: #050505;
}

.popup-title {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  padding: 12px 16px;
  background: linear-gradient(to top, rgba(5,5,5,0.85) 0%, transparent 100%);
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.03em;
}
.popup-song { font-weight: 700; }
.popup-lyrics { margin-top: 4px; font-size: 12px; font-weight: 300; line-height: 1.6; }

.popup-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: none;
  cursor: pointer;
  color: #ffffff;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.popup-close:hover { background: rgba(255,255,255,0.3); }
.gallery-wrap { width:100%; max-width:none; height:100%; border:0; border-radius:0; box-shadow:none; background:#ffffff; }
.gallery-scroll { padding:22px; }
.gallery-scroll::-webkit-scrollbar { width:12px; }.gallery-scroll::-webkit-scrollbar-track{background:#ececec}.gallery-scroll::-webkit-scrollbar-thumb{border:2px solid #ececec;border-radius:0;background:#b7b7b7}
.gallery-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.gallery-item { border:1px solid #c9c9c9; border-radius:0; background:#ececec; box-shadow:2px 2px 0 rgba(0,0,0,.07); }
.gallery-item:hover { border-color:#898989; }
.popup-inner { padding:5px; border:2px solid; border-color:#ffffff #757575 #757575 #ffffff; border-radius:0; background:#d2d2d2; }
.popup-close { top:9px; right:9px; width:22px; height:22px; border:2px solid; border-color:#ffffff #7c7c7c #7c7c7c #ffffff; border-radius:0; background:#d2d2d2; color:#565656; }
@media(max-width:980px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<!-- 팝업 -->
<div class="popup-bg" id="popup-bg" role="dialog" aria-modal="true" aria-labelledby="popup-title" tabindex="-1" onclick="closePopup(event)">
  <div class="popup-inner">
    <img id="popup-img" src="" alt="">
    <div class="popup-title" id="popup-title"></div>
  </div>
</div>

<script>
// Gallery entries come from the upload service.
var images = [];

var popupTrigger = null;

function imageUrl(img) {
  return window.EDEN_CONTENT_API + img.imagePath;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function render() {
  var grid = document.getElementById('gallery-grid');
  if (!images.length) { grid.innerHTML = '<p class="gallery-status" role="status">사진을 불러오는 중…</p>'; return; }
  grid.innerHTML = images.map(function(img, i) {
    return '<div class="gallery-item" role="button" tabindex="0" onclick="openPopup(' + i + ')">' +
      '<img src="' + escapeHtml(imageUrl(img)) + '" alt="' + escapeHtml(img.title) + '" loading="' + (i < 4 ? 'eager' : 'lazy') + '" decoding="async">' +
      '<div class="gallery-item-overlay">' +
      '<div class="gallery-item-title">' + escapeHtml(img.title) + '</div>' +
      (img.lyrics ? '<div class="gallery-item-lyrics">' + escapeHtml(img.lyrics) + '</div>' : '') +
      '</div></div>';
  }).join('');
}

function openPopup(i) {
  var img = images[i];
  if (!img) return;
  popupTrigger = document.querySelectorAll('.gallery-item')[i];
  document.getElementById('gallery-scroll').inert = true;
  document.getElementById('popup-img').src = imageUrl(img);
  document.getElementById('popup-img').alt = img.title;
  var popupTitle = document.getElementById('popup-title');
  popupTitle.textContent = '';
  if (img.song) {
    var song = document.createElement('div');
    song.className = 'popup-song';
    song.textContent = img.song;
    popupTitle.appendChild(song);

    var lyrics = document.createElement('div');
    lyrics.className = 'popup-lyrics';
    lyrics.textContent = img.lyrics;
    popupTitle.appendChild(lyrics);
  } else {
    popupTitle.textContent = img.title;
  }
  document.getElementById('popup-bg').classList.add('open');
  setPhotoViewing(true);
  document.getElementById('popup-bg').focus();
}

function setPhotoViewing(open) {
  try {
    window.parent.document.documentElement.classList.toggle('gallery-photo-open', open);
  } catch (_) {}
}
window.addEventListener('pagehide', function () { setPhotoViewing(false); });
function closePopup(e) {
  if (!e || e.target === document.getElementById('popup-bg')) {
    document.getElementById('popup-bg').classList.remove('open');
    setPhotoViewing(false);
    document.getElementById('gallery-scroll').inert = false;
    if (popupTrigger && popupTrigger.isConnected) popupTrigger.focus();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('popup-bg').classList.contains('open')) closePopup();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.gallery-item')) { e.preventDefault(); e.target.click(); }
});

try { var cached=JSON.parse(sessionStorage.getItem('eden-gallery-list')||'null'); if(Array.isArray(cached))images=cached; } catch (_) {}
render();

fetch(window.EDEN_CONTENT_API + '/api/gallery')
  .then(function(response) { if (!response.ok) throw new Error('load failed'); return response.json(); })
  .then(function(remoteImages) {
    if (!Array.isArray(remoteImages)) throw new Error('invalid gallery');
    images = remoteImages.slice().sort(function(a, b) {
      // Keep the curated migration order; subsequent uploads follow chronologically.
      var aOrder = Number.isFinite(a.displayOrder) ? a.displayOrder : Infinity;
      var bOrder = Number.isFinite(b.displayOrder) ? b.displayOrder : Infinity;
      if (aOrder !== bOrder) return aOrder - bOrder;
      return String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a.id).localeCompare(String(b.id));
    });
    try { sessionStorage.setItem('eden-gallery-list',JSON.stringify(images)); } catch (_) {}
    render();
    if (!images.length) document.getElementById('gallery-grid').innerHTML = '<p class="gallery-status" role="status">등록된 사진이 없어요.</p>';
  })
  .catch(function() { if (!images.length) document.getElementById('gallery-grid').innerHTML = '<p class="gallery-status" role="alert">사진을 불러오지 못했어요. 잠시 후 다시 열어주세요.</p>'; });


</script>
