<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/theme-init.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../css/style.css">
<title>END OF EDEN — Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Pretendard',sans-serif;background:#0a0a0f;color:#f2f2f5;min-height:100vh;padding:2rem}.detail-wrap{width:100%;max-width:960px;height:580px;margin:42px auto 0;border:.5px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;background:#0f0f14;box-shadow:0 8px 32px rgba(0,0,0,.45)}.detail-scroll{height:100%;overflow-y:auto;padding:2.5rem 4rem}.back-btn{display:inline-block;color:#6f7380;text-decoration:none;font-size:11px;letter-spacing:.06em;margin-bottom:1.5rem}.detail-title{text-align:center;font-size:18px;font-weight:500;margin-bottom:10px}.detail-meta{text-align:center;font-size:11px;color:#6f7380;margin-bottom:1.5rem}.detail-quote{text-align:center;color:#b0b4bd;font-size:13px;font-style:italic;margin-bottom:1.5rem}.detail-img{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:8px;margin-bottom:1.75rem;background:#0a0a0f}.detail-body{font-size:14px;line-height:1.9;color:#b0b4bd;white-space:pre-wrap;word-break:keep-all}.loading{text-align:center;color:#6f7380;padding:5rem 0}@media(max-width:640px){body{padding:1rem}.detail-wrap{margin-top:24px}.detail-scroll{padding:2rem 1.25rem}.detail-body{word-break:break-all}}
</style>
<script src="../js/theme.js"></script>
<script src="../js/content-api.js"></script>
<script src="../js/archive-content.js"></script>
<link rel="stylesheet" href="../css/archive-surfaces.css?v=20260911-first-indent">
</head>
<body>
<div class="detail-wrap"><div class="detail-scroll"><a class="back-btn" href="../log.html">← Back</a><div id="content" class="loading">기록을 불러오는 중…</div></div></div>
<script>
var id = new URLSearchParams(location.search).get('id');
var content = document.getElementById('content');
fetch(window.EDEN_CONTENT_API + '/api/logs/' + encodeURIComponent(id || ''))
  .then(function(response){ if(!response.ok) throw new Error(); return response.json(); })
  .then(function(log){
    content.className=''; content.textContent='';
    var title=document.createElement('div'); title.className='detail-title'; title.textContent=log.title;
    var meta=document.createElement('div'); meta.className='detail-meta'; meta.textContent=log.date+' · Daily Log';
    content.appendChild(title); content.appendChild(meta);
    if(log.quote){var quote=document.createElement('div');quote.className='detail-quote';quote.textContent='“ '+log.quote+' ”';content.appendChild(quote);}
    if(log.imagePath){var img=document.createElement('img');img.className='detail-img';img.src=window.EDEN_CONTENT_API+log.imagePath;img.alt=log.title;content.appendChild(img);}
    var body=document.createElement('div');body.className='detail-body'+(log.id==='005'?' detail-body-glass':'');body.textContent=log.body;content.appendChild(body);if(window.formatLogText)window.formatLogText(body);
    document.title='END OF EDEN — '+log.title;
  })
  .catch(function(){content.textContent='기록을 불러오지 못했어.';});
</script>
<script src="../js/log-text.js?v=20260911-first-indent"></script>
</body>
</html>
