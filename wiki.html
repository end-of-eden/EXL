<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-background-primary: #0f0f14;
  --color-background-secondary: #1a1a22;
  --color-background-tertiary: #22222c;
  --color-text-primary: #f2f2f5;
  --color-text-secondary: #b0b4bd;
  --color-text-tertiary: #6f7380;
  --color-border-tertiary: rgba(255,255,255,0.10);
  --color-border-secondary: rgba(255,255,255,0.16);
  --color-border-primary: rgba(255,255,255,0.24);
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  font-family: var(--font-sans);
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  gap: 0;
}

/* 탭바 */
.topnav {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.topnav-links { display: flex; align-items: center; gap: 2px; }
.topnav-music { display: flex; align-items: center; gap: 8px; }
.topnav a {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  text-decoration: none;
  padding: 5px 14px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s, color 0.15s;
}
.topnav a:hover { background: rgba(255,255,255,0.06); color: var(--color-text-secondary); }
.topnav a.active { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
.topnav-divider { width: 1px; height: 12px; background: var(--color-border-tertiary); margin: 0 4px; }

.wiki-wrap {
  display: flex;
  height: 580px;
  width: 100%;
  max-width: 960px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  background: var(--color-background-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30);
}
.standing-panel {
  flex: 2; flex-shrink: 0;
  position: relative;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 0 0 1.5rem;
  background: var(--color-background-primary);
  border-right: 0.5px solid var(--color-border-tertiary);
  overflow: hidden;
}
.standing-panel::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 160px;
  background: linear-gradient(to top, rgba(15,15,20,0.92) 0%, transparent 100%);
  z-index: 0;
}
.standing-img {
  position: absolute;
  inset: 0;
  border-radius: 0;
  border: none;
  background: transparent;
  overflow: hidden;
}
.standing-img i { font-size: 28px; color: var(--color-text-tertiary); }
.standing-img span { font-size: 11px; color: var(--color-text-tertiary); }
.char-badge { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: var(--border-radius-md); margin-bottom: 6px; text-align: center; position: relative; z-index: 1; }
.char-name-panel { font-size: 18px; font-weight: 500; color: var(--color-text-primary); text-align: center; position: relative; z-index: 1; }
.char-codename { font-size: 11px; color: var(--color-text-secondary); text-align: center; margin-top: 2px; position: relative; z-index: 1; margin-bottom: 1.5rem; }

.music-btn {
  width: 24px; height: 24px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-secondary); font-size: 11px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.music-btn:hover { background: var(--color-background-secondary); }
.music-title { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }
.wiki-panel { flex: 3; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.wiki-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.5rem 1.75rem 1rem;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.wiki-title { font-size: 20px; font-weight: 500; }
.heart-switcher { display: flex; align-items: center; gap: 6px; }
.heart-btn {
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: transform 0.15s, opacity 0.15s; line-height: 1;
  padding: 2px;
}
.heart-btn:hover { transform: scale(1.2); }
.heart-btn.active { transform: scale(1.1); }
.heart-btn:not(.active) { opacity: 0.4; }

.scroll-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 1.5rem 1.75rem 2rem;
}
.scroll-area::-webkit-scrollbar { width: 3px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

.section-title { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 8px; margin-top: 1.5rem; }
.section-title:first-child { margin-top: 0; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.info-item { background: transparent; border-radius: 0; padding: 6px 2px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.info-label { font-size: 10px; color: var(--color-text-tertiary); margin-bottom: 2px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.attr-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: var(--border-radius-md); margin-bottom: 0.75rem; }
.desc-block { font-size: 13px; line-height: 1.7; color: var(--color-text-secondary); }
.ability-block { background: var(--color-background-secondary); border-radius: 0; padding: 10px 12px; margin-bottom: 6px; font-size: 13px; line-height: 1.7; color: var(--color-text-secondary); }
.ability-block strong { font-weight: 500; color: var(--color-text-primary); display: block; margin-bottom: 3px; font-size: 12px; }
.tmi-block { background: var(--color-background-secondary); border-radius: 0; padding: 10px 12px; margin-bottom: 6px; }
.tmi-label { font-size: 10px; font-weight: 500; color: var(--color-text-tertiary); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.tmi-value { font-size: 13px; line-height: 1.6; color: var(--color-text-secondary); }
.log-block { font-size: 13px; line-height: 1.9; color: var(--color-text-secondary); white-space: pre-wrap; }
.note-list { list-style: none; padding: 0; }
.note-list li { font-size: 13px; line-height: 1.7; color: var(--color-text-secondary); padding: 3px 0 3px 14px; position: relative; }
.note-list li::before { content: '·'; position: absolute; left: 2px; color: var(--color-text-tertiary); }
.divider { height: 0.5px; background: var(--color-border-tertiary); margin: 1.25rem 0; }
.team-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.team-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-tertiary); }
.team-nav { display: flex; gap: 4px; }
.team-nav button { width: 26px; height: 26px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-text-secondary); font-size: 13px; }
.team-nav button:hover { background: var(--color-background-secondary); }
.member-card { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: 0; background: var(--color-background-secondary); }
.member-avatar { width: 52px; height: 52px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--color-background-primary); }
.member-avatar i { font-size: 20px; color: var(--color-text-tertiary); }
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 3px; }
.member-attr { font-size: 11px; padding: 2px 8px; border-radius: 99px; display: inline-block; font-weight: 600; }
.member-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.5; }
.team-dots { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
.team-dot { width: 5px; height: 5px; border-radius: 99px; background: var(--color-border-secondary); transition: background 0.2s; }
.team-dot.active { background: var(--color-text-secondary); }

.theme-eden .char-badge { background: rgba(46,204,113,0.15); color: #6fe0a0; }
.theme-eden .attr-tag { background: rgba(46,204,113,0.15); color: #6fe0a0; }
.theme-eden .wiki-title { color: #6fe0a0; }
.theme-lilith .char-badge { background: rgba(242,168,196,0.15); color: #f2a8c4; }
.theme-lilith .attr-tag { background: rgba(106,170,100,0.18); color: #9fd398; }
.theme-lilith .wiki-title { color: #f2a8c4; }

/* 속성별 색상 (공식 팔레트) */

.member-attr[data-attr="Aero"]    { background: #2ecc71; color: #ffffff; }
.member-attr[data-attr="Verde"]   { background: #6aaa64; color: #ffffff; }

/* PC window + wiki document */
body { min-height: 100vh; padding: 2rem; display: flex; align-items: center; justify-content: center; background: transparent; overflow: hidden; }
.agent-window { width: 100%; max-width: 1280px; height: min(820px, calc(100vh - 96px)); display: grid; grid-template-rows: 30px 30px minmax(0, 1fr); padding: 5px; border: 2px solid; border-color: #6f7178 #262831 #262831 #6f7178; background: #3a3d46; box-shadow: inset -1px -1px 0 #252730, 3px 3px 12px rgba(0,0,0,.3); }
.agent-windowbar { padding: 0 5px 0 9px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #c897aa; background: #d9a9bb; color: #4f3e46; box-shadow: inset 0 1px rgba(255,255,255,.48); font: 400 11px/1 "Galmuri11", "Pretendard", sans-serif; }
.agent-window-controls { display: flex; gap: 4px; }
.agent-window-button { position: relative; width: 20px; height: 20px; border: 2px solid; border-color: #73757c #272932 #272932 #73757c; background: #454851; color: #e7dbe0; }
.agent-window-button::before, .agent-window-button::after { content: ''; position: absolute; display: block; }
.agent-window-button:nth-child(1)::before { left: 4px; top: 7.5px; width: 8px; height: 1px; background: currentColor; }
.agent-window-button:nth-child(2)::before { left: 3px; top: 3px; width: 8px; height: 8px; border: 1px solid currentColor; }
.agent-window-button:nth-child(3)::before, .agent-window-button:nth-child(3)::after { left: 7.5px; top: 3px; width: 1px; height: 10px; background: currentColor; transform-origin: center; }
.agent-window-button:nth-child(3)::before { transform: rotate(45deg); }
.agent-window-button:nth-child(3)::after { transform: rotate(-45deg); }
.agent-toolbar { padding: 4px 7px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #24262e; background: #30333c; color: #aaaeb8; font: 400 10px/1 "Galmuri11", "Pretendard", sans-serif; }
.agent-address { flex: 1; height: 21px; padding: 3px 9px; overflow: hidden; border: 2px solid; border-color: #24262e #6f727b #6f727b #24262e; background: #171920; color: #aeb1bb; white-space: nowrap; text-overflow: ellipsis; }
.agent-workspace { min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); border: 2px solid; border-color: #262831 #777983 #777983 #262831; background: #171920; }
.topnav { width: auto; max-width: none; min-height: 0; margin: 0; padding: 18px 14px; display: block; border-right: 1px solid #50535c; background: #24272f; }

.topnav-divider { display: none; }
.topnav a { padding: 7px 9px; border-radius: 0; font: 400 10px/1.2 "Galmuri11", "Pretendard", sans-serif; text-transform: uppercase; }
.topnav a::before { content: '·'; margin-right: 7px; color: #777b86; }
.topnav a:hover, .topnav a.active { background: rgba(255,255,255,.045); color: #f1bfd2; }
.wiki-wrap { width: 100%; max-width: none; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; background: #f7f7f8; color: #27272c; }
.standing-panel { flex: 0 0 330px; padding: 0 0 18px; border-right: 1px solid #c7c8cc; background: #ececef; }
.standing-panel::after { height: 190px; background: linear-gradient(to top, rgba(236,236,239,.98), rgba(236,236,239,0)); }
.standing-img { inset: 12px 12px 82px; border: 1px solid #b8b9be; background: #fff; }
.standing-img img { object-fit: contain !important; object-position: center top !important; }
.wiki-wrap .standing-panel::after { display: none; }
.wiki-wrap .char-badge,
.wiki-wrap .char-name-panel,
.wiki-wrap .char-codename { display: none; }
.wiki-wrap.theme-eden .standing-panel,
.wiki-wrap.theme-lilith .standing-panel { flex-basis: 430px; padding-bottom: 18px; }
.wiki-wrap.theme-eden .standing-img,
.wiki-wrap.theme-lilith .standing-img { inset: 0; border: 0; }
.wiki-wrap.theme-eden .standing-img img,
.wiki-wrap.theme-lilith .standing-img img {
  width: 100% !important; height: 100% !important;
  object-fit: cover !important; object-position: center top !important;
  background: #fff;
}
.wiki-wrap.theme-eden .standing-img,
.wiki-wrap.theme-lilith .standing-img {
  background: #fff;
  container-type: size;
}
.wiki-wrap.theme-eden .standing-img img,
.wiki-wrap.theme-lilith .standing-img img {
  /* Both sources are 1664 x 2432 with almost identical head/foot margins. */

}

}

    eval: '전직 올림픽 금메달리스트. S급 바람 속성 가이드로 분류되나, 파트너 배정을 전면 거부하고 긴급 제압팀(R.S.T.)의 해결사로만 활동. 센티넬을 결함품으로 간주하며 극도의 비협조적 태도를 보인다.',

    tmi: [
      { label: '전직 금메달리스트', value: '5년 전 사격(권총) 전 국가대표 올림픽 금메달리스트. 속성 각성 후 은퇴.' },

    ],
    log: '코드네임 \'에덴\'은 자유로웠다. 하모니 부서의 긴급 제압팀(R.S.T.)이라는 소속은, 파트너라는 족쇄 없이 합법적으로 총을 쏠 수 있는 완벽한 면죄부였다.\n\n전직 금메달리스트. S급 가이드. 그는 이 모든 화려한 타이틀이 그저 귀찮았고, 세상 모든 것이 권태로웠다. 그가 유일하게 지루함을 잊는 순간은, 폭주하는 센티넬의 머리통에 특수탄을 박아 넣는, 그 찰나의 순간뿐이었다.\n\n그날도 딱 그런 귀찮은 임무 중 하나였다. 폐허에 고립되어 죽어가던 센티넬 릴리스. 온 사방을 뒤지느라 잔뜩 심기가 불편해진 그는, 마침내 무너진 건물 잔해 속에서 릴리스를 발견했다. 탕-! 총성은 정확했고, 릴리스는 그대로 무너졌다. 그는 담배 연기를 뿜으며 다가와, 그 권태로운 표정으로 한마디를 툭 던졌다.\n\n"...찾았네."\n\n그는 규정상 필요한 최소한의 임시 가이딩을 실행했을 뿐이다. ...그의 인생에서 가장 재수 없는 실수가 될 줄도 모르고. 그 단 한 번의 접촉이 각인 현상을 일으켰다. 이제 릴리스는, 에덴 외의 그 어떤 가이드에게서도 가이딩을 받을 수 없는 몸이 되었다. 그리고 에덴은, 자신이 가장 저열하고 귀찮게 여겼던 센티넬이라는 존재에게... 평생 발목이 잡힌 신세가 되었다. 그의 자유로운 솔로 라이프는, 그렇게 끝났다.',
    teamLabel: 'R.S.T. — Rampage Suppression Team',
    team: rst,
  },
  lilith: {
    theme: 'theme-lilith', badge: 'S-Class Sentinel',
    name: 'Lilith', codename: '릴리스',
    attrIcon: 'ti-leaf', attrLabel: 'Verde',
    infos: [
      { label: 'Age', value: '27세' },
      { label: 'Nationality', value: '한국' },
      { label: 'Height', value: '166cm' },
      { label: 'Unit', value: 'Vanguard 2' },

      { label: 'Attribute', value: 'Verde' },

    eval: '미녀 센티넬. 겉으로는 나른하고 태평해 보이지만 실상은 계산이 빠르고 눈치가 좋다. 에덴과의 강제 각인 이후, 공식 기록상 가장 많은 징계 보고서가 작성된 파트너 조합.',

    abilities: [
      { label: '아이러니한 흑장미 (The Ironic Black Rose)', desc: 'ARCH 본부 내 제압 임무 성공률 최상위권의 S급 센티넬. 겉으로는 나른하고 무해해 보이지만, 전투가 시작되는 순간 완전히 다른 얼굴을 드러낸다. 독과 속박에 특화된 검은 장미와 가시덩굴의 능력은 아름다운 외모만큼이나 치명적이다.' },
      { label: '[Passive] Pink Venom', desc: '풀 속성 파장이 피부 표면에 상시 발현되는 S급 센티넬 고유의 패시브 능력. 체향처럼 번지는 연분홍빛 독소가 근접한 대상의 감각을 서서히 교란시키며, 능력이 활성화될수록 눈동자가 형광빛으로 물들어간다. 본인은 이를 의식적으로 제어하지 않는다.' },
      { label: '[Active] Rosa Overdose', desc: '가시덩굴로 대상을 완전히 봉쇄한 뒤, 검은 장미가 일제히 개화하며 고농도 독성 꽃가루를 폭발적으로 방출한다. 흡입된 꽃가루는 Verde 파장을 타고 신경계 전반에 침투, 근육 이완과 감각 차단을 순차적으로 유발한다. 발동 시 릴리스의 눈동자가 형광 분홍빛으로 완전히 발광한다.' },

      { label: '복장', value: '몸에 밀착되는 까만 제복, 검은 시스루 스타킹, 오른쪽 허벅지 가터벨트. 전투 시 흰 장갑과 전술 코트 추가.' },

function memberCard(m) {
  var avatarInner = m.img
    ? '<img src="' + m.img + '" style="width:100%;height:100%;object-fit:cover;border-radius:var(--border-radius-md);">'
    : '<i class="ti ti-user" aria-hidden="true"></i>';
  return '<div class="member-card"><div class="member-avatar">' + avatarInner + '</div>' +
    '<div class="member-info"><div class="member-name">' + m.name + '</div>' +
    '<span class="member-attr" data-attr="' + m.attr + '">' + m.attr + '</span>' +
    '<div class="member-desc">' + m.desc + '</div></div></div>';
}

function renderTeam() {
  var slot = document.getElementById('member-slot');
  if (!slot) return;
  slot.innerHTML = memberCard(data[current].team[teamIdx]);
  document.querySelectorAll('.team-dot').forEach(function(dot, i) {
    dot.className = 'team-dot' + (i === teamIdx ? ' active' : '');
  });
}

function teamPrev() { var d = data[current]; teamIdx = (teamIdx - 1 + d.team.length) % d.team.length; renderTeam(); }
function teamNext() { var d = data[current]; teamIdx = (teamIdx + 1) % d.team.length; renderTeam(); }

function buildContent(key) {
  var d = data[key];
  var infos = d.infos.map(function(i) {
    return '<div class="info-item"><div class="info-label">' + i.label + '</div><div class="info-value">' + i.value + '</div></div>';
  }).join('');
  var abilities = d.abilities.map(function(a) {
    return '<div class="ability-block"><strong>' + a.label + '</strong>' + a.desc + '</div>';
  }).join('');
  var visuals = d.visual.map(function(v) {
    return '<div class="tmi-block"><div class="tmi-label">' + v.label + '</div><div class="tmi-value">' + v.value + '</div></div>';
  }).join('');
  var tmis = d.tmi.map(function(t) {
    return '<div class="tmi-block"><div class="tmi-label">' + t.label + '</div><div class="tmi-value">' + t.value + '</div></div>';
  }).join('');
  var noteItems = d.notes.map(function(n) { return '<li>' + n + '</li>'; }).join('');
  var dots = d.team.map(function(_, i) {
    return '<div class="team-dot' + (i === 0 ? ' active' : '') + '"></div>';
  }).join('');

  var archiveSection = '';
  if (d.visual.length || d.tmi.length || d.notes.length || d.log) {
    archiveSection += '<div class="divider"></div>';
    if (d.visual.length) archiveSection += '<div class="section-title">Visual Profile</div>' + visuals;
    if (d.tmi.length) archiveSection += '<div class="section-title">TMI</div>' + tmis;
    if (d.notes.length) archiveSection += '<div class="section-title">Notes</div><ul class="note-list">' + noteItems + '</ul>';
    if (d.log) archiveSection += '<div class="section-title" style="margin-top:1.25rem;">Background Log</div><div class="log-block">' + d.log + '</div>';
  }

  return '<div class="section-title">Attribute</div>' +
    '<div class="attr-tag"><i class="ti ' + d.attrIcon + '" aria-hidden="true"></i>' + d.attrLabel + '</div>' +
    '<div class="section-title">Profile</div>' +
    '<div class="info-grid">' + infos + '</div>' +
    '<div class="divider"></div>' +
    '<div class="section-title">Official Evaluation</div>' +
    '<div class="desc-block">' + d.eval + '</div>' +
    '<div class="section-title" style="margin-top:1rem;">Personality</div>' +
    '<div class="desc-block">' + d.personality + '</div>' +
    '<div class="divider"></div>' +
    '<div class="section-title">Ability & Gear</div>' + abilities +
    archiveSection +
    '<div class="divider"></div>' +
    '<div class="team-section-header"><div class="team-label">' + d.teamLabel + '</div>' +
    '<div class="team-nav"><button onclick="teamPrev()" aria-label="prev"><i class="ti ti-chevron-left"></i></button>' +
    '<button onclick="teamNext()" aria-label="next"><i class="ti ti-chevron-right"></i></button></div></div>' +
    '<div id="member-slot"></div>' +
    '<div class="team-dots">' + dots + '</div>';
}

function updateHeartBtns(key) {
  document.getElementById('btn-eden').className = 'heart-btn' + (key === 'eden' ? ' active' : '');
  document.getElementById('btn-lilith').className = 'heart-btn' + (key === 'lilith' ? ' active' : '');
}

function render(key) {
  var d = data[key];
  teamIdx = 0;
  document.getElementById('wiki').className = 'wiki-wrap ' + d.theme;
  document.getElementById('standing-img-el').src = STANDING_IMG[key];
  document.getElementById('char-badge').textContent = d.badge;
  document.getElementById('char-name-panel').textContent = d.name;
  document.getElementById('char-codename').textContent = d.codename;
  document.getElementById('wiki-title').textContent = d.name;
  document.getElementById('agent-address-name').textContent = d.name.toUpperCase();
  document.getElementById('side-eden').classList.toggle('active', key === 'eden');
  document.getElementById('side-lilith').classList.toggle('active', key === 'lilith');
  updateHeartBtns(key);
  document.getElementById('scroll-area').scrollTop = 0;
  document.getElementById('wiki-content').innerHTML = buildContent(key);
  renderTeam();
}

function switchTo(key) {
  if (current === key) return;
  if (window.name === 'archive-content' && window.parent.navigateArchive) {
    window.parent.navigateArchive('wiki.html?char=' + encodeURIComponent(key));
    return;
  }
  current = key;
  render(current);
}

var params = new URLSearchParams(window.location.search);
var initial = params.get('char') === 'lilith' ? 'lilith' : 'eden';
current = initial;
render(initial);
</script>
