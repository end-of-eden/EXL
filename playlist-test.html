<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>END OF EDEN — Archive Player Test</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('arch-color-theme') === 'light' ? 'light' : 'dark';
} catch (_) {
  document.documentElement.dataset.theme = 'dark';
}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
* { box-sizing: border-box; }
:root { --eden-blue: #87ceeb; --lilith-pink: #ff2d7a; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0a0f; }
body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
.archive-frame { width: 100%; height: 100%; border: 0; background: #0a0a0f; }
html[data-theme="light"],
html[data-theme="light"] body,
html[data-theme="light"] .archive-frame { background: #eef0f3; }

.playlist-window {
  position: fixed;
  left: auto;
  right: 7vw;
  top: 80px;
  z-index: 10000;
  width: 340px;
  height: 224px;
  min-height: 224px;
  max-height: min(430px, calc(100vh - 48px));
  overflow: hidden;
  color: #f2f2f5;
  background: #07080d;
  border: 0;
  border-radius: 12px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.32);
  user-select: none;
}
.player-head {
  position: relative;
  height: 222px;
  overflow: visible;
  background: #08090e;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.player-head.dragging { cursor: grabbing; }
.player-head button { cursor: pointer; }
.cover {
  position: absolute;
  left: 0; right: 0; top: 0;
  width: 100%; height: 498px;
  object-fit: cover;
  object-position: 50% 0%;
  filter: saturate(0.72) brightness(0.7) contrast(1.08);
}
.cover-shade {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 498px;
  background: linear-gradient(to bottom, rgba(3,5,10,0.05) 18%, rgba(3,5,10,0.28) 56%, rgba(3,5,10,0.5) 100%);
}
.now-playing {
  position: relative;
  z-index: 4;
  height: 100%;
  padding: 78px 15px 12px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.track-title {
  min-height: 18px;
  margin: 4px 22px 8px;
  color: var(--eden-blue);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  text-shadow: 0 1px 5px rgba(0,0,0,0.9);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.playback-panel {
  padding: 0;
}
.progress-row { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 7px; }
.time {
  color: rgba(255,255,255,0.92);
  font-size: 8px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.7);
}
.time:last-child { text-align: right; }
.progress {
  height: 3px;
  border-radius: 99px;
  background: rgba(5,8,14,0.42);
  overflow: hidden;
}
.progress-fill { width: 34%; height: 100%; background: var(--eden-blue); }
.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 8px; }
.center-controls { display: flex; align-items: center; gap: 8px; }
.control {
  width: 24px; height: 24px; padding: 0;
  display: grid; place-items: center;
  border: 0;
  background: transparent;
  color: var(--eden-blue);
  cursor: pointer;
  font-size: 17px;
}
.control:hover { color: #fff; }
.control:focus, .control:focus-visible, .volume-slider:focus, .volume-slider:focus-visible { outline: none; }
.control.play { width: 25px; height: 25px; color: var(--eden-blue); background: transparent; }
.volume-control { position: relative; width: 28px; justify-self: start; }
.volume-popover {
  position: absolute;
  left: 25px;
  bottom: 0;
  width: 68px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  opacity: 0;
  visibility: hidden;
  transform: translateX(-5px);
  transition: opacity 0.15s, visibility 0.15s, transform 0.15s;
}
.volume-control:hover .volume-popover,
.volume-control:focus-within .volume-popover {
  opacity: 1;
  visibility: visible;
  transform: translateX(0);
}
.volume-slider {
  --volume-level: 60%;
  -webkit-appearance: none;
  appearance: none;
  width: 60px;
  height: 18px;
  margin: 0;
  border-radius: 99px;
  background: linear-gradient(to right, var(--eden-blue) 0 var(--volume-level), rgba(5,8,14,0.42) var(--volume-level) 100%) center / 100% 4px no-repeat;
  cursor: pointer;
}
.volume-slider::-webkit-slider-runnable-track { width: 60px; height: 18px; background: transparent; }
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 1px;
  height: 18px;
  border: 0;
  background: transparent;
}
.volume-slider::-moz-range-track { width: 60px; height: 18px; background: transparent; }
.volume-slider::-moz-range-thumb { width: 1px; height: 18px; border: 0; background: transparent; }
.volume-icon { width: 17px; height: 17px; display: block; }
#volume.muted .volume-waves { display: none; }
.control.loop { position: relative; justify-self: end; }
.control.loop.active { color: var(--lilith-pink); }
.loop-one {
  position: absolute;
  right: 0;
  bottom: 0;
  display: none;
  font: 700 8px/1 'Pretendard', sans-serif;
}
.control.loop.one .loop-one { display: block; }
.queue {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  top: 222px;
  bottom: 0;
  min-height: 0;
  margin-top: 0;
  padding: 24px 10px 18px;
  border-top: 0;
  background: linear-gradient(to bottom, rgba(7,8,13,0) 0, rgba(7,8,13,0.22) 30%, rgba(7,8,13,0.62) 68%, #07080d 100%);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.queue::-webkit-scrollbar { display: none; width: 0; height: 0; }
.queue-heading { padding: 7px 8px 10px; color: #5f6573; font-size: 8px; letter-spacing: 0.16em; text-align: center; }
.queue-item {
  width: 100%; min-height: 30px; padding: 6px 10px;
  display: block;
  border: 0; border-radius: 3px;
  color: #d7d9df; background: transparent; text-align: center; cursor: pointer;
  touch-action: manipulation;
}
.queue-item:not(.active):not(:disabled):hover { color: var(--lilith-pink); background: transparent; }
.queue-item.active { color: var(--eden-blue); background: transparent; }
.queue-item:disabled { color: inherit; opacity: 1; cursor: default; background: transparent; }
.queue-name {
  display: inline-block;
  overflow: hidden;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
  transition: color 0.15s;
}
.resize-zone {
  position: fixed;
  z-index: 4;
  height: 9px;
  cursor: ns-resize;
  touch-action: none;
}
#youtube-player { position: fixed; left: -10000px; top: -10000px; width: 200px; height: 200px; }

html[data-theme="light"] .playlist-window {
  color: #242832;
  background: #f7f8fb;
  border-color: rgba(25,30,40,0.2);
  box-shadow: 0 8px 20px rgba(25,30,40,0.18);
}
html[data-theme="light"] .cover { filter: saturate(0.72) brightness(0.96) contrast(0.96); }
html[data-theme="light"] .cover-shade {
  background: linear-gradient(to bottom, rgba(247,248,251,0.01) 18%, rgba(247,248,251,0.1) 54%, rgba(247,248,251,0.34) 100%);
}
html[data-theme="light"] .track-title { color: #2387ad; text-shadow: 0 1px 2px rgba(255,255,255,0.95); }
html[data-theme="light"] .time {
  color: #25303b;
  text-shadow: 0 1px 2px rgba(255,255,255,0.95), 0 0 4px rgba(255,255,255,0.85);
}
html[data-theme="light"] .progress {
  background: rgba(35,42,55,0.3);
}
html[data-theme="light"] .progress-fill { background: #2387ad; }
html[data-theme="light"] .control {
  color: #2387ad;
  filter: drop-shadow(0 1px 1px rgba(255,255,255,0.9));
}
html[data-theme="light"] .volume-popover {
  background: transparent;
}
html[data-theme="light"] .volume-slider {
  background: linear-gradient(to right, var(--eden-blue) 0 var(--volume-level), rgba(35,42,55,0.28) var(--volume-level) 100%) center / 100% 4px no-repeat;
}
html[data-theme="light"] .control:hover { color: #156f92; }
html[data-theme="light"] .queue {
  background: linear-gradient(to bottom, rgba(247,248,251,0) 0, rgba(247,248,251,0.2) 30%, rgba(247,248,251,0.64) 68%, #f7f8fb 100%);
}
html[data-theme="light"] .queue-heading { color: #626b79; text-shadow: 0 1px 2px rgba(255,255,255,0.95); }
html[data-theme="light"] .queue-item { color: #303743; text-shadow: 0 1px 2px rgba(255,255,255,0.95); }
html[data-theme="light"] .queue-item:not(.active):not(:disabled):hover { color: var(--lilith-pink); background: transparent; }
html[data-theme="light"] .queue-item.active { color: #2387ad; background: transparent; }
html[data-theme="light"] .queue-item:disabled { color: #303743; background: transparent; }

@media (max-width: 640px) {
  .playlist-window { left: 12px; right: 12px; top: 12px; width: auto; max-height: 65vh; }
}
</style>
</head>
<body>
<iframe class="archive-frame" id="archive-frame" title="END OF EDEN archive" src="main.html"></iframe>

<aside class="playlist-window" aria-label="YouTube playlist test player">
  <div class="player-head">
    <img class="cover" src="img/gallery/004.jpg" alt="Eden and Lilith playlist cover">
    <div class="cover-shade"></div>
    <div class="now-playing">
      <div class="track-title" id="track-title">재생 버튼을 눌러 시작</div>
      <div class="playback-panel">
        <div class="progress-row">
          <span class="time" id="current-time">00:00</span>
          <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="time" id="duration">00:00</span>
        </div>
        <div class="controls">
          <div class="volume-control">
            <button class="control" type="button" id="volume" aria-label="음소거">
              <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"></path>
                <path class="volume-waves" d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </button>
            <div class="volume-popover">
              <input class="volume-slider" id="volume-slider" type="range" min="0" max="100" value="60" aria-label="음량">
            </div>
          </div>
          <div class="center-controls">
            <button class="control" type="button" id="prev" aria-label="이전 곡"><i class="ti ti-player-skip-back-filled"></i></button>
            <button class="control play" type="button" id="play" aria-label="재생"><i class="ti ti-player-play-filled"></i></button>
            <button class="control" type="button" id="next" aria-label="다음 곡"><i class="ti ti-player-skip-forward-filled"></i></button>
          </div>
          <button class="control loop" type="button" id="loop" aria-label="반복 없음" title="반복 없음"><i class="ti ti-repeat"></i><span class="loop-one">1</span></button>
        </div>
      </div>
    </div>
  </div>
  <div class="queue">
    <div class="queue-heading">PLAYLIST</div>
    <div id="queue-list"></div>
  </div>
  <div class="resize-zone" id="resize-zone" aria-hidden="true"></div>
</aside>

<div id="youtube-player" aria-hidden="true"></div>
<script>
var playlistId = 'PLKNbEhdi8XzI';
var displayTracks = [
  { videoId: 'rBa4ZYxI4vM', title: '미안해 널 미워해' },
  { videoId: '4i1wkzAlU5M', title: 'HAPPY DAY' },
  { videoId: 'CgiPuXwhhfY', title: 'SOS' },
  { videoId: 'q90SFMi8aUg', title: 'ザムザ' },
  { videoId: 'h1QTkwJnX0E', title: 'はぐ' },
  { videoId: 'p363yleNtGI', title: '私は、私達は' },
  { videoId: 'xt_IlpwNAFo', title: 'light' },
  { videoId: 'VcQIpQB4Fiw', title: '大丈夫' },
  { videoId: 'RvuWxiaPUqQ', title: '야행성' },
  { videoId: 'QW87DP4-elQ', title: 'cares' },
  { videoId: 'ACJyvx9XtAg', title: '虚無さん' },
  { videoId: 'oLu4n9HToG0', title: 'Darling' },
  { videoId: 'ACDf9fhpuqo', title: 'Whiskey and Morphine' }
];
var customTitlesByVideoId = {};
displayTracks.forEach(function (track) {
  if (track.videoId) customTitlesByVideoId[track.videoId] = track.title;
});
var player;
var playlist = [];
var playing = false;
var muted = false;
var loopMode = 'off';
var playlistWindow = document.querySelector('.playlist-window');
var playerHead = document.querySelector('.player-head');
var resizeZone = document.getElementById('resize-zone');
var archiveFrame = document.getElementById('archive-frame');
var dragState = null;
var resizeState = null;

function applyShellTheme(theme) {
  document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
}

window.addEventListener('storage', function (event) {
  if (event.key === 'arch-color-theme') applyShellTheme(event.newValue);
});

archiveFrame.addEventListener('load', function () {
  try {
    var frameRoot = archiveFrame.contentDocument.documentElement;
    applyShellTheme(frameRoot.dataset.theme);
    new MutationObserver(function () {
      applyShellTheme(frameRoot.dataset.theme);
    }).observe(frameRoot, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (_) {}
});

function formatTime(seconds) {
  if (!isFinite(seconds)) return '00:00';
  var minutes = Math.floor(seconds / 60);
  var rest = Math.floor(seconds % 60);
  return String(minutes).padStart(2, '0') + ':' + String(rest).padStart(2, '0');
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('youtube-player', {
    width: 200,
    height: 200,
    playerVars: {
      listType: 'playlist',
      list: playlistId,
      playsinline: 1,
      controls: 0,
      rel: 0
    },
    events: {
      onReady: function (event) {
        event.target.setVolume(60);
        event.target.cuePlaylist({ listType: 'playlist', list: playlistId });
      },
      onStateChange: updatePlayer
    }
  });
}

function updatePlayer(event) {
  playing = event.data === YT.PlayerState.PLAYING;
  document.querySelector('#play i').className = playing ? 'ti ti-player-pause-filled' : 'ti ti-player-play-filled';
  document.getElementById('play').setAttribute('aria-label', playing ? '일시정지' : '재생');

  playlist = player.getPlaylist() || playlist;
  var data = player.getVideoData();
  var displayTitle = data && (customTitlesByVideoId[data.video_id] || data.title);
  if (displayTitle) document.getElementById('track-title').textContent = displayTitle;
  renderQueue(data && data.video_id);

  if (event.data === YT.PlayerState.ENDED && loopMode === 'one') {
    player.seekTo(0);
    player.playVideo();
  }
}

function renderQueue(activeVideoId) {
  var list = document.getElementById('queue-list');
  list.innerHTML = '';
  displayTracks.forEach(function (track) {
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'queue-item' + (track.videoId && track.videoId === activeVideoId ? ' active' : '');
    item.innerHTML = '<span class="queue-name">' + track.title + '</span>';
    if (!track.videoId) {
      item.disabled = true;
    } else {
      item.addEventListener('click', function () {
        document.getElementById('track-title').textContent = track.title;
        renderQueue(track.videoId);
        var playlistIndex = playlist.indexOf(track.videoId);
        if (playlistIndex >= 0) player.playVideoAt(playlistIndex);
        else player.loadVideoById(track.videoId);
      });
    }
    list.appendChild(item);
  });
}

renderQueue('');

document.getElementById('play').addEventListener('click', function () {
  if (!player || !player.playVideo) return;
  if (playing) player.pauseVideo(); else player.playVideo();
});
document.getElementById('prev').addEventListener('click', function () { if (player) player.previousVideo(); });
document.getElementById('next').addEventListener('click', function () { if (player) player.nextVideo(); });
document.getElementById('volume').addEventListener('click', function () {
  if (!player) return;
  muted = !muted;
  if (muted) player.mute(); else player.unMute();
  document.getElementById('volume').classList.toggle('muted', muted);
});
document.getElementById('volume-slider').addEventListener('input', function (event) {
  if (!player || !player.setVolume) return;
  var volume = Number(event.target.value);
  event.target.style.setProperty('--volume-level', volume + '%');
  player.setVolume(volume);
  muted = volume === 0;
  if (muted) player.mute(); else player.unMute();
  document.getElementById('volume').classList.toggle('muted', muted);
});

document.getElementById('loop').addEventListener('click', function () {
  var button = document.getElementById('loop');
  loopMode = loopMode === 'off' ? 'all' : loopMode === 'all' ? 'one' : 'off';
  if (player && player.setLoop) player.setLoop(loopMode === 'all');
  button.classList.toggle('active', loopMode !== 'off');
  button.classList.toggle('one', loopMode === 'one');
  var label = loopMode === 'all' ? '전체 반복' : loopMode === 'one' ? '한 곡 반복' : '반복 없음';
  button.setAttribute('aria-label', label);
  button.setAttribute('title', label);
});

playerHead.addEventListener('pointerdown', function (event) {
  if (event.button !== 0 || event.target.closest('button, input')) return;
  var rect = playlistWindow.getBoundingClientRect();
  dragState = {
    pointerId: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    startLeft: rect.left,
    startTop: rect.top,
    offsetX: event.clientX - rect.left,
    offsetY: event.clientY - rect.top,
    started: false
  };
  playerHead.setPointerCapture(event.pointerId);
});

playerHead.addEventListener('pointermove', function (event) {
  if (!dragState || event.pointerId !== dragState.pointerId) return;
  if (!dragState.started) {
    var distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
    if (distance < 4) return;
    dragState.started = true;
    playlistWindow.style.left = dragState.startLeft + 'px';
    playlistWindow.style.top = dragState.startTop + 'px';
    playlistWindow.style.right = 'auto';
    playerHead.classList.add('dragging');
  }
  var maxLeft = Math.max(8, window.innerWidth - playlistWindow.offsetWidth - 8);
  var maxTop = Math.max(8, window.innerHeight - playlistWindow.offsetHeight - 8);
  var left = Math.min(maxLeft, Math.max(8, event.clientX - dragState.offsetX));
  var top = Math.min(maxTop, Math.max(8, event.clientY - dragState.offsetY));
  playlistWindow.style.left = left + 'px';
  playlistWindow.style.top = top + 'px';
  placeResizeZone();
});

function endDrag(event) {
  if (!dragState || event.pointerId !== dragState.pointerId) return;
  dragState = null;
  playerHead.classList.remove('dragging');
}

playerHead.addEventListener('pointerup', endDrag);
playerHead.addEventListener('pointercancel', endDrag);

function placeResizeZone() {
  var rect = playlistWindow.getBoundingClientRect();
  resizeZone.style.left = rect.left + 'px';
  resizeZone.style.top = (rect.bottom - 9) + 'px';
  resizeZone.style.width = rect.width + 'px';
}

resizeZone.addEventListener('pointerdown', function (event) {
  if (event.button !== 0) return;
  resizeState = {
    pointerId: event.pointerId,
    startY: event.clientY,
    startHeight: playlistWindow.offsetHeight
  };
  resizeZone.setPointerCapture(event.pointerId);
  event.preventDefault();
});

resizeZone.addEventListener('pointermove', function (event) {
  if (!resizeState || event.pointerId !== resizeState.pointerId) return;
  var rect = playlistWindow.getBoundingClientRect();
  var maxHeight = Math.min(430, window.innerHeight - rect.top - 8);
  var nextHeight = Math.min(maxHeight, Math.max(224, resizeState.startHeight + event.clientY - resizeState.startY));
  playlistWindow.style.height = nextHeight + 'px';
  placeResizeZone();
});

function endResize(event) {
  if (!resizeState || event.pointerId !== resizeState.pointerId) return;
  resizeState = null;
  placeResizeZone();
}

resizeZone.addEventListener('pointerup', endResize);
resizeZone.addEventListener('pointercancel', endResize);
window.addEventListener('resize', placeResizeZone);
placeResizeZone();

setInterval(function () {
  if (!player || !player.getCurrentTime) return;
  var current = player.getCurrentTime() || 0;
  var duration = player.getDuration() || 0;
  document.getElementById('current-time').textContent = formatTime(current);
  document.getElementById('duration').textContent = formatTime(duration);
  document.getElementById('progress-fill').style.width = duration ? ((current / duration) * 100) + '%' : '0%';
}, 500);

var youtubeApi = document.createElement('script');
youtubeApi.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(youtubeApi);
</script>
</body>
</html>
