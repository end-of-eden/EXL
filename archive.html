<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>END OF EDEN — Archive Player Test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0a0f; }
body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
.archive-frame { width: 100%; height: 100%; border: 0; background: #0a0a0f; }

.playlist-window {
  position: fixed;
  left: 24px;
  top: 24px;
  z-index: 10000;
  width: 326px;
  height: 146px;
  min-height: 146px;
  max-height: min(620px, calc(100vh - 48px));
  resize: vertical;
  overflow: auto;
  color: #f2f2f5;
  background: rgba(12, 14, 22, 0.94);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 13px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  backdrop-filter: blur(18px);
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}
.playlist-window::-webkit-scrollbar { width: 3px; }
.playlist-window::-webkit-scrollbar-track { background: transparent; }
.playlist-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 99px; }
.player-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: 112px 1fr;
  min-height: 144px;
  background: #0c0e16;
}
.cover { width: 112px; height: 144px; object-fit: cover; object-position: 50% 45%; }
.now-playing { min-width: 0; padding: 20px 18px 16px; display: flex; flex-direction: column; }
.player-label { color: #87ceeb; font-size: 9px; letter-spacing: 0.18em; }
.track-title {
  min-height: 38px;
  margin-top: 10px;
  color: #f2f2f5;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.45;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.controls { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.control {
  width: 27px; height: 27px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%;
  background: transparent;
  color: #b0b4bd;
  cursor: pointer;
}
.control:hover { color: #fff; background: rgba(255,255,255,0.08); }
.control.play { width: 31px; height: 31px; color: #0a0a0f; background: #f2f2f5; }
.track-count { margin-left: auto; color: #6f7380; font-size: 9px; letter-spacing: 0.08em; }
.queue { padding: 8px 12px 18px; border-top: 1px solid rgba(255,255,255,0.08); }
.queue-heading { padding: 11px 8px 9px; color: #6f7380; font-size: 9px; letter-spacing: 0.16em; }
.queue-item {
  width: 100%; min-height: 40px; padding: 8px;
  display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px;
  border: 0; border-radius: 8px;
  color: #8f94a0; background: transparent; text-align: left; cursor: pointer;
}
.queue-item:hover { color: #daddE5; background: rgba(255,255,255,0.05); }
.queue-item.active { color: #f2f2f5; background: rgba(135,206,235,0.08); }
.queue-no { color: #5e6370; font-size: 9px; font-variant-numeric: tabular-nums; }
.queue-name { overflow: hidden; font-size: 11px; letter-spacing: 0.04em; text-overflow: ellipsis; white-space: nowrap; }
#youtube-player { position: fixed; left: -10000px; top: -10000px; width: 200px; height: 200px; }

@media (max-width: 640px) {
  .playlist-window { left: 12px; right: 12px; top: 12px; width: auto; max-height: 65vh; resize: none; }
}
</style>
</head>
<body>
<iframe class="archive-frame" title="END OF EDEN archive" src="main.html"></iframe>

<aside class="playlist-window" aria-label="YouTube playlist test player">
  <div class="player-head">
    <img class="cover" src="img/player/004.jpg" alt="Eden and Lilith playlist cover">
    <div class="now-playing">
      <div class="player-label">ARCHIVE PLAYLIST</div>
      <div class="track-title" id="track-title">재생 버튼을 눌러 시작</div>
      <div class="controls">
        <button class="control" type="button" id="prev" aria-label="이전 곡"><i class="ti ti-player-skip-back"></i></button>
        <button class="control play" type="button" id="play" aria-label="재생"><i class="ti ti-player-play"></i></button>
        <button class="control" type="button" id="next" aria-label="다음 곡"><i class="ti ti-player-skip-forward"></i></button>
        <span class="track-count" id="track-count">YOUTUBE</span>
      </div>
    </div>
  </div>
  <div class="queue">
    <div class="queue-heading">PLAYLIST · DRAG WINDOW TO EXPAND</div>
    <div id="queue-list"></div>
  </div>
</aside>

<div id="youtube-player" aria-hidden="true"></div>
<script>
var playlistId = 'PLKNbEhdi8XzI';
var player;
var playlist = [];
var playing = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('youtube-player', {
    width: 200,
    height: 200,
    playerVars: {
      listType: 'playlist',
      list: playlistId,
      playsinline: 1,
      controls: 0,
      rel: 0
    },
    events: {
      onReady: function (event) {
        event.target.cuePlaylist({ listType: 'playlist', list: playlistId });
      },
      onStateChange: updatePlayer
    }
  });
}

function updatePlayer(event) {
  playing = event.data === YT.PlayerState.PLAYING;
  document.querySelector('#play i').className = playing ? 'ti ti-player-pause' : 'ti ti-player-play';
  document.getElementById('play').setAttribute('aria-label', playing ? '일시정지' : '재생');

  playlist = player.getPlaylist() || playlist;
  var index = player.getPlaylistIndex();
  var data = player.getVideoData();
  if (data && data.title) document.getElementById('track-title').textContent = data.title;
  if (playlist.length) document.getElementById('track-count').textContent = (index + 1) + ' / ' + playlist.length;
  renderQueue(index);
}

function renderQueue(activeIndex) {
  var list = document.getElementById('queue-list');
  list.innerHTML = '';
  playlist.forEach(function (videoId, index) {
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'queue-item' + (index === activeIndex ? ' active' : '');
    item.innerHTML = '<span class="queue-no">' + String(index + 1).padStart(2, '0') + '</span><span class="queue-name">TRACK ' + String(index + 1).padStart(2, '0') + '</span>';
    item.addEventListener('click', function () { player.playVideoAt(index); });
    list.appendChild(item);
  });
}

document.getElementById('play').addEventListener('click', function () {
  if (!player || !player.playVideo) return;
  if (playing) player.pauseVideo(); else player.playVideo();
});
document.getElementById('prev').addEventListener('click', function () { if (player) player.previousVideo(); });
document.getElementById('next').addEventListener('click', function () { if (player) player.nextVideo(); });

var youtubeApi = document.createElement('script');
youtubeApi.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(youtubeApi);
</script>
</body>
</html>
